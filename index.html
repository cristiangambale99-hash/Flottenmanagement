const BRIEF = { left:25, right:45, top:50, bottom:30 };

async function buildInspectionPDF(plate, quarterLabel){
  const v = STATE.vehicles.find(x => x.plate === plate);
  const hist = historyList(plate);
  const insp = hist.find(r => r.quarter === quarterLabel) || hist[hist.length-1];
  const sev = severityOfRecord(insp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4", compress:true });
  const FONT = await ensurePdfFont(doc);
  const pageWidth = doc.internal.pageSize.getWidth();
  const contentWidth = pageWidth - BRIEF.left - BRIEF.right;
  const brand = [43, 182, 183];
  const brandDark = [29, 131, 132];
  const inkMuted = [94, 114, 115];

  const drawLetterhead = () => doc.addImage(BRIEF_BG, "PNG", 0, 0, 210, 297, "brief", "FAST");

  drawLetterhead();
  doc.internal.events.subscribe("addPage", drawLetterhead);

  doc.setFont(FONT,"bold"); doc.setFontSize(15); doc.setTextColor(...brandDark);
  doc.text("Fahrzeug-Inspektion Nr. " + v.nr + " – " + v.plate, BRIEF.left, BRIEF.top);

  doc.setFont(FONT,"normal"); doc.setFontSize(10); doc.setTextColor(22,41,42);
  doc.text(v.model + " (" + v.art + ")", BRIEF.left, BRIEF.top + 6.5);

  doc.setFontSize(9); doc.setTextColor(...inkMuted);
  doc.text("Quartal " + insp.quarter + "   ·   " + fmtDateCH(insp.date) +
           "   ·   Kontrolliert von " + insp.inspector + "   ·   " + SEV_LABEL[sev],
           BRIEF.left, BRIEF.top + 12);
  doc.setDrawColor(...brand); doc.setLineWidth(0.5);
  doc.line(BRIEF.left, BRIEF.top + 15.5, pageWidth - BRIEF.right, BRIEF.top + 15.5);

  let y = BRIEF.top + 22;
  SECTIONS.forEach(sec => {
    const body = [];
    sec.items.forEach(item => {
      if (item.type === "header"){
        body.push([{ content:item.label, colSpan:3, styles:{ fontStyle:"bold", fillColor:[234,246,246], textColor:[14,67,68] } }]);
        return;
      }
      const a = insp.answers[item.key];
      if (!a) return;
      if (item.type === "zahl"){ body.push([item.label, a.value + " km", ""]); return; }
      let valueText = a.value;
      if (item.hasExpiry && a.ablauf) valueText += " (Ablauf: " + fmtDateCH(a.ablauf) + ")";
      body.push([item.label.replace(/^– /,""), valueText, a.comment || ""]);
    });
    doc.autoTable({
      startY:y, head:[[sec.title, "Zustand", "Bemerkung"]], body, theme:"grid",
      styles:{ font:FONT, fontSize:8, cellPadding:1.8, overflow:"linebreak" },
      headStyles:{ fillColor:brand, textColor:255, fontStyle:"bold" },
      columnStyles:{ 0:{ cellWidth:62 }, 1:{ cellWidth:33 }, 2:{ cellWidth:contentWidth - 95 } },
      margin:{ left:BRIEF.left, right:BRIEF.right, top:BRIEF.top, bottom:BRIEF.bottom + 8 },
      tableWidth: contentWidth,
    });
    y = doc.lastAutoTable.finalY + 7;
  });

  const footY = 297 - BRIEF.bottom - 3;
  const pageCount = doc.internal.getNumberOfPages();
  for (let i=1; i<=pageCount; i++){
    doc.setPage(i);
    doc.setFont(FONT,"normal"); doc.setFontSize(7.5); doc.setTextColor(...inkMuted);
    doc.text("Fahrzeug-Inspektion " + v.plate + " · " + insp.quarter + " · erstellt am " + fmtDateCH(isoDate(new Date())),
             BRIEF.left, footY);
    doc.text("Seite " + i + " / " + pageCount, pageWidth - BRIEF.right, footY, { align:"right" });
  }

  const fname = "Fahrzeug-Inspektion_Nr" + v.nr + "_" + v.plate.replace(/\s+/g,"") + "_" + insp.quarter.replace(/\s+/g,"_") + ".pdf";
  doc.setProperties({ title:"Fahrzeug-Inspektion Nr. " + v.nr + " – " + v.plate + " – " + insp.quarter });
  return { doc, fname, v, insp, sev };
}

async function generateInspectionPDF(plate, quarterLabel){
  const { doc, fname } = await buildInspectionPDF(plate, quarterLabel);
  doc.save(fname);
}

/* ---------- Automatischer Mailversand ---------- */

const MAIL_DEFAULT_TO = "c1c5ced6.clean-service.ch@emea.teams.ms";
/* Fester Versandweg: Serverfunktion auf derselben Domain, die über Resend sendet. */
const MAIL_ENDPOINT = "/api/send-report";

function mailSettings(){
  if (!STATE.settings) STATE.settings = {};
  const st = STATE.settings;
  if (st.mailTo === undefined) st.mailTo = MAIL_DEFAULT_TO;
  if (st.autoSend === undefined) st.autoSend = true;
  st.mailEndpoint = MAIL_ENDPOINT;
  return st;
}

function mailKey(plate, quarter){ return plate + "__" + quarter; }

function mailStatus(plate, quarter){
  return (STATE.mailLog || {})[mailKey(plate, quarter)] || null;
}

async function sendInspectionMail(plate, quarterLabel, opts){
  const st = mailSettings();
  const quiet = opts && opts.quiet;
  let entry = { sentAt:new Date().toISOString(), ok:false, error:null, to:st.mailTo };
  try {
    const { doc, fname, v, insp, sev } = await buildInspectionPDF(plate, quarterLabel);
    const base64 = doc.output("datauristring").split(",")[1];
    const payload = {
      to: st.mailTo,
      subject: "Fahrzeug-Inspektion " + v.plate + " · " + insp.quarter + " · " + SEV_LABEL[sev],
      body: "Fahrzeug " + v.plate + " (" + v.model + ", Nr. " + v.nr + ")\n" +
            "Quartal: " + insp.quarter + "\n" +
            "Datum: " + fmtDateCH(insp.date) + "\n" +
            "Kontrolliert von: " + insp.inspector + "\n" +
            "Ergebnis: " + SEV_LABEL[sev] + "\n\n" +
            "Der vollständige Bericht liegt als PDF bei.",
      filename: fname,
      contentBase64: base64,
    };

    /* Serverfunktion auf derselben Domain — sie sendet über Resend.
       Bei Netz- oder Serverfehlern wird einmal nachgefasst. */
    const post = () => fetch(MAIL_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    let res = await post();
    if (!res.ok && res.status >= 500){
      await new Promise(r => setTimeout(r, 1500));
      res = await post();
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    entry.ok = true;
    entry.id = data.id || null;
  } catch (e){
    let msg = String(e.message || e);
    if (/jsPDF|jspdf/i.test(msg)) msg = "PDF-Bibliothek nicht geladen — Seite neu laden und erneut versuchen.";
    else if (/Failed to fetch|NetworkError/i.test(msg)) msg = "Serverfunktion /api/send-report nicht erreichbar.";
    entry.error = msg;
  }

  if (!STATE.mailLog) STATE.mailLog = {};
  STATE.mailLog[mailKey(plate, quarterLabel)] = entry;
  await saveState();

  if (!quiet){
    if (entry.ok) toast("Bericht an Teams-Kanal gesendet", "pos");
    else toast("Versand fehlgeschlagen — " + entry.error, "neg");
  }
  return entry;
}

async function sendMailFromButton(el){
  const label = el.textContent;
  el.disabled = true; el.textContent = "Wird gesendet …";
  try { await sendInspectionMail(el.dataset.plate, el.dataset.quarter); }
  finally { el.disabled = false; el.textContent = label; render(); }
}

/* ---------- Event wiring ---------- */

function attachViewHandlers(){
  document.querySelectorAll('[data-action="detail"]').forEach(el => el.addEventListener("click", () => openDetail(el.dataset.plate)));
  document.querySelectorAll('[data-action="detail-quarter"]').forEach(el => el.addEventListener("click", () => openDetail(el.dataset.plate, el.dataset.quarter)));
  document.querySelectorAll('[data-action="download-pdf"]').forEach(el => el.addEventListener("click", () => downloadPdfFromButton(el)));
  document.querySelectorAll('[data-action="send-mail"]').forEach(el => el.addEventListener("click", () => sendMailFromButton(el)));
  document.querySelectorAll('[data-action="inspect-this"]').forEach(el => el.addEventListener("click", () => {
    startInspection(el.dataset.plate);
  }));
  document.querySelectorAll('[data-action="quick-inspect"]').forEach(el => el.addEventListener("click", () => {
    const due = STATE.vehicles.filter(x => isInspectionDue(x.plate));
    startInspection((due[0] || STATE.vehicles[0]).plate);
  }));
  document.querySelectorAll('[data-action="goto-mangel"]').forEach(el => el.addEventListener("click", () => {
    mangelFilter = "alle"; mangelResp = "alle"; switchView("mangel");
  }));
  document.querySelectorAll("[data-dashfilter]").forEach(el => el.addEventListener("click", () => {
    dashFilter = el.dataset.dashfilter; render();
  }));
  document.querySelectorAll('[data-action="open-archive"]').forEach(el => el.addEventListener("click", () => {
    archiveState.plate = el.dataset.plate; archiveState.year = new Date().getFullYear(); switchView("archive");
  }));

  const archivePlateSel = document.getElementById("archive-plate");
  if (archivePlateSel) archivePlateSel.addEventListener("change", (e) => { archiveState.plate = e.target.value; render(); });
  const archivePrev = document.querySelector('[data-action="archive-prev-year"]');
  if (archivePrev) archivePrev.addEventListener("click", () => { archiveState.year -= 1; render(); });
  const archiveNext = document.querySelector('[data-action="archive-next-year"]');
  if (archiveNext) archiveNext.addEventListener("click", () => { archiveState.year += 1; render(); });
  document.querySelectorAll('[data-action="archive-year"]').forEach(el => el.addEventListener("click", () => { archiveState.year = Number(el.dataset.year); render(); }));

  const addVehicleBtn = document.getElementById("add-vehicle-btn");
  if (addVehicleBtn) addVehicleBtn.addEventListener("click", () => { fleetForm.adding = true; render(); });
  const cancelVehicleBtn = document.getElementById("cancel-vehicle-btn");
  if (cancelVehicleBtn) cancelVehicleBtn.addEventListener("click", () => { fleetForm.adding = false; render(); });
  const saveVehicleBtn = document.getElementById("save-vehicle-btn");
  if (saveVehicleBtn){
    saveVehicleBtn.addEventListener("click", async () => {
      const plate = document.getElementById("add-plate").value;
      const art = document.getElementById("add-art").value;
      const model = document.getElementById("add-model").value;
      const err = addVehicle(plate, art, model);
      const errEl = document.getElementById("add-vehicle-error");
      if (err){ errEl.textContent = err; return; }
      fleetForm.adding = false; await saveState(); render();
      toast("Fahrzeug hinzugefügt", "pos");
    });
  }
  document.querySelectorAll('[data-action="remove-vehicle"]').forEach(el => {
    el.addEventListener("click", async () => {
      const plate = el.dataset.plate;
      if (!confirm("Fahrzeug " + plate + " inkl. seines gesamten Kontrollverlaufs wirklich entfernen?")) return;
      removeVehicle(plate);
      if (inspectForm.plate === plate){ inspectForm.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; inspectForm.formOpen=false; inspectForm.draft=null; }
      if (archiveState.plate === plate){ archiveState.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; }
      await saveState(); render();
      toast("Fahrzeug " + plate + " entfernt");
    });
  });

  const fleetSearchEl = document.getElementById("fleet-search");
  if (fleetSearchEl){
    fleetSearchEl.addEventListener("input", (e) => {
      fleetSearch = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const again = document.getElementById("fleet-search");
      if (again){ again.focus(); again.setSelectionRange(caret, caret); }
    });
  }

  document.querySelectorAll("[data-mangel-id]").forEach(el => {
    el.addEventListener("change", async (e) => {
      STATE.mangelStatus[el.dataset.mangelId] = e.target.value;
      await saveState(); render();
      toast("Status auf „" + e.target.value + "“ gesetzt", e.target.value === "Erledigt" ? "pos" : "");
    });
  });
  document.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("click", () => { mangelFilter = el.dataset.filter; render(); }));
  document.querySelectorAll("[data-resp]").forEach(el => el.addEventListener("click", () => { mangelResp = el.dataset.resp; render(); }));
  const mangelSearchEl = document.getElementById("mangel-search");
  if (mangelSearchEl){
    mangelSearchEl.addEventListener("input", (e) => {
      mangelSearch = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const again = document.getElementById("mangel-search");
      if (again){ again.focus(); again.setSelectionRange(caret, caret); }
    });
  }

  const setSave = document.getElementById("set-save");
  if (setSave) setSave.addEventListener("click", async () => {
    const st = mailSettings();
    st.mailTo = document.getElementById("set-mailto").value.trim();
    st.autoSend = document.getElementById("set-autosend").checked;
    await saveState(); render();
    toast("Einstellungen gespeichert", "pos");
  });
  const setTest = document.getElementById("set-test");
  if (setTest) setTest.addEventListener("click", async () => {
    const st = mailSettings();
    st.mailTo = document.getElementById("set-mailto").value.trim();
    await saveState();
    const v = STATE.vehicles[0];
    if (!v){ toast("Kein Fahrzeug vorhanden", "neg"); return; }
    setTest.disabled = true; setTest.textContent = "Testversand läuft …";
    await sendInspectionMail(v.plate, latestInspection(v.plate).quarter);
    setTest.disabled = false; setTest.textContent = "Testversand mit letzter Kontrolle";
    render();
  });

  const plateSel = document.getElementById("insp-plate");
  if (plateSel) plateSel.addEventListener("change", (e) => {
    inspectForm.plate = e.target.value; inspectForm.formOpen=false; inspectForm.draft=null; inspectForm.successMsg=null; inspectForm.lastSavedQuarter=null; render();
  });
  const openFormBtn = document.getElementById("open-form-btn");
  if (openFormBtn) openFormBtn.addEventListener("click", () => startInspection(inspectForm.plate));

  ["cancel-inspection","cancel-inspection-top"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", () => {
      inspectForm.formOpen=false; inspectForm.draft=null; inspectForm.errorKeys=[]; inspectForm.errorMsg=""; render();
    });
  });

  document.querySelectorAll('[data-action="discard-draft"]').forEach(el => el.addEventListener("click", async () => {
    clearDraft(draftKey()); inspectForm.draft = null; inspectForm.draftRestored = false;
    await saveState(); render(); toast("Entwurf verworfen");
  }));

  document.querySelectorAll('[data-action="section-ok"]').forEach(el => el.addEventListener("click", () => {
    setSectionOk(el.dataset.section); scheduleDraftSave(); render();
    toast("Abschnitt als in Ordnung erfasst", "pos");
  }));

  document.querySelectorAll("[data-step]").forEach(el => el.addEventListener("click", () => {
    const target = Number(el.dataset.step);
    if (target > inspectForm.step && !validateStep(inspectForm.step)) { render(); return; }
    inspectForm.step = target; inspectForm.errorKeys=[]; inspectForm.errorMsg=""; render();
  }));
  const prevBtn = document.getElementById("step-prev");
  if (prevBtn) prevBtn.addEventListener("click", () => {
    inspectForm.step = Math.max(0, inspectForm.step - 1);
    inspectForm.errorKeys=[]; inspectForm.errorMsg=""; render();
  });
  const nextBtn = document.getElementById("step-next");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    if (!validateStep(inspectForm.step)){ render(); focusFirstError(); return; }
    inspectForm.step = Math.min(SECTIONS.length, inspectForm.step + 1);
    inspectForm.errorKeys=[]; inspectForm.errorMsg=""; render();
    window.scrollTo({ top: 0, behavior:"smooth" });
  });

  const quarterSel = document.getElementById("insp-quarter");
  if (quarterSel) quarterSel.addEventListener("change", (e) => { inspectForm.editingQuarter = e.target.value; inspectForm.draft=null; render(); });
  const dateInput = document.getElementById("insp-date");
  if (dateInput) dateInput.addEventListener("input", (e) => inspectForm.date = e.target.value);
  document.querySelectorAll("[data-inspector]").forEach(el => el.addEventListener("click", () => {
    const mode = el.dataset.inspector;
    inspectForm.inspectorMode = mode;
    inspectForm.inspector = mode === "andere" ? "" : mode;
    inspectForm.errorMsg = "";
    scheduleDraftSave(); render();
    const nameEl = document.getElementById("insp-inspector-name");
    if (nameEl) nameEl.focus();
  }));
  const inspectorName = document.getElementById("insp-inspector-name");
  if (inspectorName) inspectorName.addEventListener("input", (e) => {
    inspectForm.inspector = e.target.value; scheduleDraftSave();
  });

  document.querySelectorAll(".zpill[data-key]").forEach(el => el.addEventListener("click", () => {
    inspectForm.draft.answers[el.dataset.key].value = el.dataset.value;
    inspectForm.errorKeys = inspectForm.errorKeys.filter(k => k !== el.dataset.key);
    scheduleDraftSave(); render();
  }));
  document.querySelectorAll(".comment-input").forEach(el => el.addEventListener("input", (e) => {
    inspectForm.draft.answers[el.dataset.key].comment = e.target.value; scheduleDraftSave();
  }));
  document.querySelectorAll('[data-action="remove-photo"]').forEach(el => el.addEventListener("click", () => {
    inspectForm.draft.answers[el.dataset.key].photo = null; scheduleDraftSave(); render();
  }));
  document.querySelectorAll(".photo-input").forEach(el => el.addEventListener("change", (e) => {
    const file = e.target.files[0];
    inspectForm.draft.answers[el.dataset.key].photo = file ? file.name : null;
    scheduleDraftSave(); render();
    if (file) toast("Foto „" + file.name + "“ vermerkt");
  }));
  document.querySelectorAll(".km-input").forEach(el => el.addEventListener("input", (e) => {
    inspectForm.draft.answers[el.dataset.key].value = Number(e.target.value); scheduleDraftSave();
  }));
  document.querySelectorAll(".ablauf-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].ablauf = e.target.value; render(); }));

  const submitBtn = document.getElementById("submit-inspection");
  if (submitBtn){
    submitBtn.addEventListener("click", async () => {
      for (let i = 0; i < SECTIONS.length; i++){
        if (!validateStep(i)){
          const nameMissing = i === 0 && !(inspectForm.inspector || "").trim();
          inspectForm.step = i;
          if (!nameMissing) inspectForm.errorMsg = "Abschnitt " + (i+1) + ": " + inspectForm.errorMsg;
          render();
          if (nameMissing){
            const nameEl = document.getElementById("insp-inspector-name");
            if (nameEl){ nameEl.scrollIntoView({ behavior:"smooth", block:"center" }); nameEl.focus(); }
            toast("Bitte den Namen der kontrollierenden Person eintragen", "neg");
          } else {
            focusFirstError();
            toast("Bitte fehlende Bemerkungen ergänzen", "neg");
          }
          return;
        }
      }
      inspectForm.errorKeys = []; inspectForm.errorMsg = "";

      const plate = inspectForm.plate;
      const quarter = inspectForm.editingQuarter;
      const hist = STATE.inspections[plate];
      const existingIdx = hist.findIndex(r => r.quarter === quarter);
      const record = { quarter, date: inspectForm.date, inspector: inspectForm.inspector, answers: JSON.parse(JSON.stringify(inspectForm.draft.answers)), createdAt: Date.now() };
      if (existingIdx >= 0) hist[existingIdx] = record;
      else { hist.push(record); hist.sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter)); }

      const isNowLatest = quarter === historyList(plate)[historyList(plate).length-1].quarter;
      if (isNowLatest){
        FIELD_ITEMS.forEach(item => {
          const a = record.answers[item.key];
          const id = mangelId(plate, item.key);
          if (answerSeverity(item, a) !== "bad") delete STATE.mangelStatus[id];
          else if (!STATE.mangelStatus[id]) STATE.mangelStatus[id] = "Offen";
        });
      }
      clearDraft(plate + "__" + quarter);
      await saveState();
      inspectForm.formOpen=false; inspectForm.draft=null; inspectForm.draftRestored=false; inspectForm.step=0;
      inspectForm.lastSavedQuarter = quarter;
      window.scrollTo(0,0);
      render();
      toast("Kontrolle " + quarter + " für " + plate + " gespeichert", "pos");

      if (mailSettings().autoSend){
        setTimeout(async () => {
          toast("Bericht wird versendet …");
          await sendInspectionMail(plate, quarter);
          render();
        }, 900);
      }
    });
  }
}

/* ---------- Boot ---------- */

async function boot(){
  await loadState();
  inspectForm.plate = STATE.vehicles[0].plate;
  archiveState.plate = STATE.vehicles[0].plate;
  render();
}
boot();

</script>
</body>
</html>
