<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flottenmanagement | Clean Service Scaramuzzo AG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =====================================================================
   Clean Service Scaramuzzo AG — App-Layout
   Übernommen aus cs-reporting, materialbestellungen und angebot-pfs:
   Türkis-Skala aus dem CD, heller Verlaufshintergrund mit Tropfen-Dekor,
   schwebende App-Fläche, weiche Karten mit grossen Radien, Pill-Navigation,
   Kapitälchen-Mikrotypografie und Monospace-Zahlen.
   ===================================================================== */

:root{
  color-scheme: light only;

  /* Corporate Design — Türkis-Skala */
  --brand:#2BB6B7;
  --brand-600:#22A0A1;
  --brand-700:#1B8384;
  --brand-800:#146061;
  --brand-50:#EAF8F8;
  --brand-100:#D3F0F1;
  --brand-200:#A8E1E2;
  --brand-300:#7DD2D3;

  /* Text und Linien */
  --ink:#1B2B32;
  --ink-700:#3A4C54;
  --ink-500:#647178;
  --ink-300:#A7B0B4;
  --line:#EDF1F2;
  --line-strong:#E1EAE9;

  /* Flächen */
  --surface:#FFFFFF;
  --bg:#FBFDFC;
  --wash:#F4F9F9;

  /* Signalfarben */
  --pos:#2E9E5B;        --pos-tint:#E6F4EC;
  --warn:#C98A3E;       --warn-tint:#F6EBD9;
  --neg:#B8503E;        --neg-tint:#F8E8E4;

  /* Tiefe und Form */
  --shadow-sm:0 1px 2px rgba(23,37,31,.05);
  --shadow:0 1px 2px rgba(23,37,31,.04), 0 6px 16px rgba(23,37,31,.06);
  --shadow-lg:0 4px 10px rgba(23,37,31,.05), 0 24px 48px -24px rgba(23,37,31,.22);
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:22px;
  --pill:999px;

  --ui:Verdana, Geneva, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

*{ box-sizing:border-box; }

html, body{ margin:0; padding:0; min-height:100%; }

body{
  font-family:var(--ui);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 12% 15%, rgba(255,255,255,0.16), transparent 38%),
    radial-gradient(circle at 88% 82%, rgba(190,226,233,0.35), transparent 45%),
    radial-gradient(circle at 92% 8%, rgba(96,190,179,0.4), transparent 35%),
    linear-gradient(150deg, #0b5354 0%, #0f7274 22%, #2bb6b7 52%, #63c2bc 78%, #a7dad6 100%);
  background-attachment:fixed;
  position:relative;
}

h1,h2,h3,p{ margin:0; }
a{ color:var(--brand-700); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--brand-200); border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }

@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ============ Hintergrund-Dekor ============ */
.brand-bg-decor{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.decor-drop{ position:absolute; opacity:.16; filter:blur(1px); }
.decor-drop-1{ width:640px; height:640px; top:-180px; left:-220px; transform:rotate(200deg); }
.decor-drop-2{ width:520px; height:520px; bottom:-200px; right:-160px; transform:rotate(15deg); opacity:.22; }

/* ============ App-Fläche ============ */
.app{
  position:relative; z-index:1;
  max-width:1180px; margin:40px auto;
  background:var(--bg);
  border-radius:var(--radius-lg);
  box-shadow:0 30px 70px rgba(4,40,40,.35), 0 8px 22px rgba(4,40,40,.18);
  overflow:hidden;
}

.app-bar{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 28px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:11px; }
.brand img{ height:34px; width:auto; display:block; }
.brand-name{ font-size:13px; font-weight:bold; letter-spacing:-.01em; line-height:1.25; }
.brand-sub{
  font-size:9.5px; font-weight:bold; letter-spacing:.14em; text-transform:uppercase;
  color:var(--brand-700); margin-top:3px;
}
.nav-pills{ display:flex; gap:6px; flex-wrap:wrap; }
.nav-pills button{
  padding:7px 15px; border-radius:var(--pill);
  border:1px solid var(--line); background:var(--surface);
  font-family:inherit; font-size:12px; font-weight:bold; color:var(--ink-500);
  cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.nav-pills button:hover{ border-color:var(--brand-300); color:var(--ink); }
.nav-pills button:active{ transform:scale(.97); }
.nav-pills button.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.app-meta{ font-size:10.5px; color:var(--ink-500); line-height:1.5; text-align:right; }

.due-strip{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:11px 28px; background:var(--brand-50);
  border-bottom:1px solid var(--line);
  font-size:11.5px; color:var(--ink-500);
}
.due-strip-label{
  font-size:9.5px; font-weight:bold; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand-700);
}
.due-chip{
  all:unset; cursor:pointer;
  padding:4px 11px; border-radius:var(--pill);
  border:1px solid var(--brand-200); background:var(--surface);
  font-size:11.5px; font-weight:bold; color:var(--ink);
}
.due-chip:hover{ border-color:var(--brand); background:var(--brand-50); }

main{ display:block; padding:28px 28px 48px; animation:fadeSlideIn .22s ease-out; }

/* ============ Seitenkopf ============ */
header.page-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  flex-wrap:wrap; gap:16px;
  margin-bottom:22px; padding-bottom:16px;
  border-bottom:2px solid var(--ink);
}
header.page-head h1{ font-size:26px; font-weight:bold; letter-spacing:-.015em; }
header.page-head p{ color:var(--ink-500); font-size:12px; margin-top:5px; }
.toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* ============ Buttons ============ */
.btn{
  background:var(--surface); color:var(--ink-500);
  border:1px solid var(--line); border-radius:var(--pill);
  padding:8px 15px; font-family:inherit; font-size:12px; font-weight:bold;
  cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:hover{ border-color:var(--brand-300); color:var(--ink); }
.btn:active{ transform:scale(.97); }
.btn.primary-action{ background:var(--brand); border-color:var(--brand); color:#fff; padding:10px 20px; }
.btn.primary-action:hover{ background:var(--brand-600); border-color:var(--brand-600); color:#fff; }
.btn.secondary{ background:var(--brand-50); border-color:var(--brand-200); color:var(--brand-700); }
.btn.secondary:hover{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.danger{ background:var(--neg); border-color:var(--neg); color:#fff; }
.btn.danger:hover{ background:#A03F2E; border-color:#A03F2E; color:#fff; }
.btn.small{ padding:5px 11px; font-size:11px; }
.btn.danger.small{ background:var(--neg-tint); border-color:#EDCCC4; color:var(--neg); }
.btn.danger.small:hover{ background:var(--neg); border-color:var(--neg); color:#fff; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

/* ============ Kennzahlen ============ */
.kpi-row{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
  gap:12px; margin-bottom:22px;
}
.kpi{
  background:var(--surface); border:1px solid var(--line);
  border-top:4px solid var(--brand);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:15px 16px 16px; text-align:center;
}
.kpi.k-pos{ border-top-color:var(--pos); }
.kpi.k-warn{ border-top-color:var(--warn); }
.kpi.k-neg{ border-top-color:var(--neg); }
.kpi.k-due{ border-top-color:var(--ink); }
.kpi .label{
  font-size:10px; color:var(--ink-500); margin-top:5px;
  text-transform:uppercase; letter-spacing:.05em; font-weight:bold;
}
.kpi .value{ font-family:var(--mono); font-size:26px; font-weight:bold; color:var(--brand-600); }
.kpi .value.pos{ color:var(--pos); }
.kpi .value.warn{ color:var(--warn); }
.kpi .value.neg{ color:var(--neg); }
.kpi .value.due{ color:var(--ink-500); }
.kpi .value .unit{ font-size:12px; font-weight:normal; color:var(--ink-500); margin-left:3px; }
.kpi .sub{ font-size:10.5px; color:var(--ink-500); margin-top:4px; }

/* ============ Karten ============ */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px 20px; margin-bottom:16px; overflow:hidden;
}
.card h2{ font-size:15px; font-weight:bold; }
.card .desc{ font-size:11.5px; color:var(--ink-500); margin-bottom:14px; }
.card-head{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
}
.card-head h2{ margin-bottom:0; }
.card.flush{ padding:0; }

/* Getönter Kartenkopf */
.card > .card-head,
.card > h2:first-child{
  margin:-18px -20px 16px; padding:14px 20px;
  background:var(--brand-50);
  border-bottom:1px solid var(--line);
  color:var(--ink);
}
.card > h2:first-child:has(+ .desc){ margin-bottom:0; padding-bottom:5px; border-bottom:0; }
.card > h2:first-child:has(+ .desc) + .desc{
  margin:0 -20px 16px; padding:0 20px 13px;
  background:var(--brand-50); border-bottom:1px solid var(--line);
}
.card.flush > .card-head{ margin:0 0 14px; padding:14px 20px; }
.card.flush > .table-wrap th:first-child,
.card.flush > .table-wrap td:first-child{ padding-left:20px; }
.card.flush > .table-wrap th:last-child,
.card.flush > .table-wrap td:last-child{ padding-right:20px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-sidebar{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
.stack > * + *{ margin-top:14px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hint{ font-size:10.5px; color:var(--ink-500); margin-top:3px; }

/* ============ Tabellen ============ */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th, td{ padding:9px 11px; text-align:right; vertical-align:top; }
th:first-child, td:first-child{ text-align:left; }
th{
  font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-500); background:none; white-space:nowrap;
  border-bottom:1px solid var(--line-strong);
}
td{ border-bottom:1px solid var(--line); }
tbody tr:hover{ background:var(--wash); }
tfoot td{ font-weight:bold; background:var(--wash); border-top:1px solid var(--brand-200); }
td.text, th.text{ text-align:left; }
tr.clickable{ cursor:pointer; }
tr.row-overdue{ background:var(--neg-tint); }
tr.row-overdue:hover{ background:#F5DED8; }

/* ============ Tags ============ */
.tag{
  display:inline-block; font-size:10px; font-weight:bold; padding:3px 9px;
  border-radius:var(--pill); white-space:nowrap;
  background:var(--brand-50); color:var(--brand-700); border:1px solid var(--brand-200);
}
.tag.pos{ background:var(--pos-tint); color:var(--pos); border-color:#C9E6D5; }
.tag.warn{ background:var(--warn-tint); color:#9A6720; border-color:#E8D2AE; }
.tag.neg{ background:var(--neg-tint); color:var(--neg); border-color:#EDCCC4; }
.tag.idle{ background:var(--line); color:var(--ink-500); border-color:var(--line-strong); }

/* ============ Formulare ============ */
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:10px; font-weight:bold; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-500); margin-bottom:5px;
}
.field .hint{ font-size:10.5px; color:var(--ink-300); margin-top:4px; }
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:9px 11px;
}
textarea{ min-height:70px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--brand-300);
  box-shadow:0 0 0 3px var(--brand-100);
}
.check{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:10px; cursor:pointer; }
.check input[type=checkbox], .check input[type=radio]{ width:16px; height:16px; accent-color:var(--brand); }

/* Fotozeile im Mängelfeld */
.photo-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:12px; }
.photo-btn{ display:inline-flex; align-items:center; gap:7px; }
.photo-btn input[type=file]{ display:none; }
.photo-chip{
  display:inline-flex; align-items:center; gap:8px; max-width:100%;
  padding:4px 6px 4px 11px; border-radius:var(--pill);
  border:1px solid var(--line-strong); background:var(--surface);
  font-size:11px; font-weight:bold; color:var(--ink-700);
}
.photo-chip .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
.photo-chip button{
  all:unset; cursor:pointer; width:18px; height:18px; border-radius:var(--pill);
  display:flex; align-items:center; justify-content:center;
  background:var(--line); color:var(--ink-700); font-size:12px; flex:none;
}
.photo-chip button:hover{ background:var(--neg); color:#fff; }
.photo-hint{ font-size:10.5px; color:var(--ink-300); }

/* XL-Erfassung für Mitarbeitende vor Ort */
.entry input, .entry select{ font-size:15px; padding:13px 12px; }
.entry .btn.primary-action{ padding:14px 24px; font-size:14px; }

/* ============ Hinweise, Leerzustand ============ */
.note{
  border:1px solid var(--brand-200); background:var(--brand-50);
  padding:12px 15px; border-radius:var(--radius-sm);
  font-size:11.5px; line-height:1.55; color:var(--ink-700);
}
.note.warn{ border-color:#E8D2AE; background:var(--warn-tint); }
.note.alert{ border-color:#EDCCC4; background:var(--neg-tint); }
.empty{ padding:44px 20px; text-align:center; color:var(--ink-500); font-size:12.5px; }
.empty h3{ font-size:14px; color:var(--ink); margin-bottom:6px; }

/* ============ Dialog ============ */
.modal-overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(27,43,50,.6);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  width:min(660px,100%); max-height:88vh; overflow:auto;
  background:var(--surface); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:24px 26px; position:relative;
  animation:fadeSlideIn .22s ease-out;
}
.modal h2{ font-size:16px; margin-bottom:16px; }
.modal-close{
  all:unset; cursor:pointer; position:absolute; top:18px; right:20px;
  width:30px; height:30px; border-radius:var(--pill);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--ink-700); background:var(--line);
}
.modal-close:hover{ background:var(--brand-100); color:var(--brand-800); }

/* ============ Reiter ============ */
.tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.tabs button{
  padding:7px 15px; border:1px solid var(--line); background:var(--surface);
  border-radius:var(--pill); font-family:inherit; font-size:12px; font-weight:bold;
  color:var(--ink-500); cursor:pointer; white-space:nowrap;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.tabs button:hover{ border-color:var(--brand-300); color:var(--ink); }
.tabs button:active{ transform:scale(.97); }
.tabs button.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

/* ============ Druck ============ */
@media print{
  @page{ size:A4 portrait; margin:14mm 14mm 18mm; }
  body{ background:#fff; font-size:10pt; }
  .brand-bg-decor, .app-bar, .due-strip, .toolbar, .no-print, .btn{ display:none !important; }
  .app{ margin:0; max-width:none; box-shadow:none; border-radius:0; background:#fff; }
  main{ padding:0; }
  .card{ break-inside:avoid; box-shadow:none; }
  .kpi, .card, .tag, th{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}

/* ============ Mobil ============ */
@media (max-width:900px){
  .app{ margin:0; border-radius:0; }
  .app-bar{ padding:12px 16px; }
  .app-meta{ display:none; }
  .due-strip{ padding:10px 16px; }
  main{ padding:20px 16px 40px; }
  .grid-2, .grid-sidebar{ grid-template-columns:1fr; }
  .quarter-grid{ grid-template-columns:1fr 1fr !important; }
}

/* =====================================================================
   Flottenmanagement — app-eigene Bausteine auf denselben Tokens
   ===================================================================== */

/* Swiss-Kontrollschild-Chip (Signatur-Element dieser App) */
.plate{
  display:inline-flex; align-items:stretch; flex:none; border-radius:4px;
  border:1.3px solid var(--ink); font-family:var(--ui);
  font-weight:bold; font-size:11.5px; background:#fff; color:var(--ink);
  line-height:18px; white-space:nowrap; overflow:visible;
}
.plate-kt{
  flex:none; background:#0B4EA2; color:#fff; padding:0 5px; font-size:9.5px;
  display:flex; align-items:center; border-radius:2px 0 0 2px;
}
.plate-num{ flex:none; padding:0 7px; letter-spacing:.02em; white-space:nowrap; }
/* Die Kontrollschild-Spalte darf nie umbrechen oder gestaucht werden */
td:first-child, th:first-child{ white-space:nowrap; }
td:first-child{ width:1%; }

/* Ampel-Übersicht (Fahrzeug-Kachelraster) */
.fleet-chip-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:10px; }
.fleet-chip{
  all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.fleet-chip:hover{ border-color:var(--brand-300); box-shadow:var(--shadow); transform:translateY(-1px); }
.fleet-chip-model{ font-size:10.5px; color:var(--ink-500); }
.fleet-chip{ position:relative; padding-left:18px; }
.fleet-chip::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:8px;
  border-radius:var(--radius-sm) 0 0 var(--radius-sm); background:var(--ink-300);
}
.fleet-chip-ok::before{ background:var(--pos); }
.fleet-chip-warn::before{ background:var(--warn); }
.fleet-chip-bad::before{ background:var(--neg); }
.fleet-chip-ok{ border-color:#C9E6D5; }
.fleet-chip-warn{ border-color:#E8D2AE; background:linear-gradient(100deg, var(--warn-tint) 0%, #fff 62%); }
.fleet-chip-bad{ border-color:#EDCCC4; background:linear-gradient(100deg, var(--neg-tint) 0%, #fff 62%); }
.chip-status{
  display:inline-flex; align-items:center;
  font-size:10.5px; font-weight:bold; letter-spacing:.02em;
}
.fleet-chip-ok .chip-status{ color:var(--pos); }
.fleet-chip-warn .chip-status{ color:#9A6720; }
.fleet-chip-bad .chip-status{ color:var(--neg); }
.fleet-chip-due{ outline:2px dashed var(--ink); outline-offset:-2px; }
.chip-due-badge{
  font-size:9px; font-weight:bold; letter-spacing:.06em; text-transform:uppercase;
  background:var(--ink); color:#fff; padding:3px 9px; border-radius:var(--pill);
  white-space:nowrap;
}
.chip-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; }

/* Ampel-Legende */
.ampel-legend{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.ampel-legend span{ display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:bold; color:var(--ink-500); }
.ampel-legend b{ font-family:var(--mono); color:var(--ink); }

/* Status-Punkt */
/* Ampellicht — überall dasselbe Signal */
.lamp{
  display:inline-block; width:12px; height:12px; border-radius:50%;
  flex:none; vertical-align:-1px; margin-right:11px;
}
.lamp-ok{ background:var(--pos); box-shadow:0 0 0 3px var(--pos-tint); }
.lamp-warn{ background:var(--warn); box-shadow:0 0 0 3px var(--warn-tint); }
.lamp-bad{ background:var(--neg); box-shadow:0 0 0 3px var(--neg-tint); }
.lamp-lg{ width:16px; height:16px; box-shadow:0 0 0 4px currentColor; }
.tl-item > .lamp, .status-banner .lamp{ margin-right:0; }

/* Statuszelle in Tabellen */
td.status-cell{ white-space:nowrap; font-weight:bold; }
tr.sev-ok td:first-child{ box-shadow:inset 4px 0 0 var(--pos); }
tr.sev-warn td:first-child{ box-shadow:inset 4px 0 0 var(--warn); }
tr.sev-bad td:first-child{ box-shadow:inset 4px 0 0 var(--neg); }
tr.sev-ok .status-cell{ color:var(--pos); }
tr.sev-warn .status-cell{ color:#9A6720; }
tr.sev-bad .status-cell{ color:var(--neg); }

/* Statusbanner im Dialog und in Quartalskarten */
.status-banner{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-radius:var(--radius-sm); margin-bottom:16px;
  font-size:13px; font-weight:bold; border:1px solid var(--line);
}
.status-banner.ok{ background:var(--pos-tint); border-color:#C9E6D5; color:#1F7A45; }
.status-banner.warn{ background:var(--warn-tint); border-color:#E8D2AE; color:#8A5C1B; }
.status-banner.bad{ background:var(--neg-tint); border-color:#EDCCC4; color:var(--neg); }
.status-banner.na{ background:var(--line); color:var(--ink-500); }

/* Zustands-Pillen im Kontrollformular */
.pill-row{ display:flex; flex-wrap:wrap; gap:6px; }
.zpill{
  all:unset; cursor:pointer; font-size:12px; font-weight:bold; padding:8px 14px;
  border-radius:var(--pill); border:1px solid var(--line-strong);
  color:var(--ink-500); background:var(--surface);
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.zpill:active{ transform:scale(.96); }
.zpill.z-ok.z-active{ background:var(--pos); border-color:var(--pos); color:#fff; }
.zpill.z-warn.z-active{ background:var(--warn); border-color:var(--warn); color:#fff; }
.zpill.z-bad.z-active{ background:var(--neg); border-color:var(--neg); color:#fff; }
.zpill.z-na.z-active{ background:var(--ink-300); border-color:var(--ink-300); color:#fff; }
.zpill:not(.z-active):hover{ border-color:var(--brand-300); color:var(--ink); }

.form-item{ margin-bottom:16px; }
.form-item-label{ font-size:12.5px; font-weight:bold; margin-bottom:8px; }
.form-item-indent{ margin-left:22px; }
.form-subheader{
  font-weight:bold; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand-700); margin:20px 0 8px; padding-top:14px;
  border-top:1px solid var(--line);
}
.form-extra{
  margin-top:9px; padding:10px 12px; border-radius:var(--radius-sm);
  border:1px solid #E8D2AE; background:var(--warn-tint);
}
.form-extra-bad{ border-color:#EDCCC4; background:var(--neg-tint); }
.ablauf-row{
  display:flex; align-items:center; gap:8px; font-size:11.5px;
  color:var(--ink-500); font-weight:bold; margin-top:9px;
}
.ablauf-row input{ width:auto; }
.ablauf-row.expired{ color:var(--neg); }
.ablauf-row.expired input{ border-color:var(--neg); }

/* Kontroll-Verlauf (Zeitleiste über Quartale) */
.timeline{ display:flex; align-items:flex-start; overflow-x:auto; padding:6px 2px 4px; }
.tl-item{
  display:flex; flex-direction:column; align-items:center; min-width:118px; flex-shrink:0;
  text-align:center; padding:10px 8px; border-radius:var(--radius-sm);
}
.tl-item-current{ background:var(--brand-50); }
.tl-quarter{ font-family:var(--mono); font-weight:bold; font-size:12.5px; margin-top:5px; }
.tl-now-badge{
  background:var(--brand); color:#fff; font-size:9px; font-weight:bold;
  padding:2px 8px; border-radius:var(--pill); text-transform:uppercase;
  margin-top:4px; display:inline-block; letter-spacing:.06em;
}
.tl-meta{ margin:5px 0 6px; line-height:1.45; font-size:10.5px; color:var(--ink-500); }
.tl-connector{ flex:0 0 26px; height:2px; background:var(--line-strong); margin-top:24px; align-self:flex-start; }

/* Archiv */
.year-nav{ display:flex; align-items:center; gap:10px; margin-bottom:6px; font-family:var(--mono); }
.year-nav-btn{
  all:unset; cursor:pointer; width:30px; height:30px; border-radius:var(--radius-sm);
  border:1px solid var(--line-strong); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:bold; color:var(--ink);
}
.year-nav-btn:hover{ background:var(--brand); border-color:var(--brand); color:#fff; }
.year-nav-label{ font-size:17px; font-weight:bold; min-width:64px; text-align:center; }
.year-chips{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
.year-chip{
  all:unset; cursor:pointer; font-size:11.5px; font-weight:bold; padding:5px 13px;
  border-radius:var(--pill); border:1px solid var(--line); background:var(--surface); color:var(--ink-500);
}
.year-chip:hover{ border-color:var(--brand-300); color:var(--ink); }
.year-chip-active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.year-summary{ color:var(--ink-500); font-size:12px; margin-bottom:14px; }
.quarter-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.quarter-card{
  border:1px solid var(--line); border-top:4px solid var(--ink-300);
  border-radius:var(--radius-sm); padding:14px 12px;
  text-align:center; background:var(--surface); box-shadow:var(--shadow-sm);
}
.quarter-card.q-ok{ border-top-color:var(--pos); }
.quarter-card.q-warn{ border-top-color:var(--warn); background:var(--warn-tint); }
.quarter-card.q-bad{ border-top-color:var(--neg); background:var(--neg-tint); }
.quarter-card-title{ font-family:var(--mono); font-weight:bold; font-size:13px; margin-bottom:8px; }
.quarter-card-empty{ color:var(--ink-300); font-size:11.5px; padding:8px 0; }

.add-vehicle-form{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px;
  background:var(--brand-50); border:1px solid var(--brand-100);
  padding:16px; border-radius:var(--radius-sm); margin-top:14px;
}
.add-vehicle-form .field{ margin-bottom:0; }
.due-badge{
  font-size:9px; font-weight:bold; text-transform:uppercase; letter-spacing:.06em;
  color:#fff; background:var(--ink); padding:3px 9px; border-radius:var(--pill);
}

/* =====================================================================
   Täglicher Betrieb — Stepper, Aktionskarte, Toast, Filterleisten
   ===================================================================== */

/* Aktionskarte auf dem Dashboard */
.action-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:780px){ .action-grid{ grid-template-columns:1fr; } }
.action-block{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:14px 16px; background:var(--surface);
}
.action-block.urgent{ border-color:#EDCCC4; background:var(--neg-tint); }
.action-head{ display:flex; align-items:baseline; gap:9px; margin-bottom:10px; }
.action-num{ font-family:var(--mono); font-size:24px; font-weight:bold; color:var(--brand-600); line-height:1; }
.action-block.urgent .action-num{ color:var(--neg); }
.action-label{ font-size:10px; font-weight:bold; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-500); }
.action-list{ display:flex; flex-wrap:wrap; gap:6px; }
.action-item{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  padding:6px 12px; border-radius:var(--pill);
  border:1px solid var(--line-strong); background:var(--surface);
  font-size:11.5px; font-weight:bold; color:var(--ink);
}
.action-item:hover{ border-color:var(--brand); background:var(--brand-50); }
.action-item .go{ color:var(--brand-700); font-size:13px; }
.action-empty{ font-size:12px; color:var(--ink-500); }
.all-clear{
  display:flex; align-items:center; gap:12px;
  border:1px solid #C9E6D5; background:var(--pos-tint); color:#1F7A45;
  border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;
  font-size:12.5px; font-weight:bold;
}
.all-clear .ac-icon{
  width:30px; height:30px; border-radius:var(--pill); background:var(--pos); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;
}

/* Segment-Filter */
.segment{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.segment button{
  padding:6px 13px; border:1px solid var(--line); background:var(--surface);
  border-radius:var(--pill); font-family:inherit; font-size:11.5px; font-weight:bold;
  color:var(--ink-500); cursor:pointer;
}
.segment button:hover{ border-color:var(--brand-300); color:var(--ink); }
.segment button.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.segment-label{
  font-size:9.5px; font-weight:bold; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-500); margin-right:2px;
}
.filter-bar{
  display:flex; gap:16px; flex-wrap:wrap; align-items:center;
  margin-bottom:16px;
}

/* Kontroll-Stepper */
.stepper{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.step-chip{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  padding:7px 14px 7px 7px; border-radius:var(--pill);
  border:1px solid var(--line); background:var(--surface);
  font-size:11.5px; font-weight:bold; color:var(--ink-500);
}
.step-chip:hover{ border-color:var(--brand-300); color:var(--ink); }
.step-chip .step-num{
  width:22px; height:22px; border-radius:var(--pill); flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--line); color:var(--ink-500); font-size:11px;
}
.step-chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.step-chip.active .step-num{ background:var(--brand); color:#fff; }
.step-chip.has-bad .step-num{ background:var(--neg); color:#fff; }
.step-chip.has-warn .step-num{ background:var(--warn); color:#fff; }
.step-chip.clean .step-num{ background:var(--pos); color:#fff; }

.progress{ height:5px; border-radius:var(--pill); background:var(--line); overflow:hidden; margin-bottom:18px; }
.progress-fill{ height:100%; background:var(--brand); transition:width .25s ease; }

.step-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.step-head h3{ font-size:16px; font-weight:bold; }
.step-head p{ font-size:11.5px; color:var(--ink-500); margin-top:4px; }

.form-item.item-error{
  border:1px solid var(--neg); border-radius:var(--radius-sm);
  padding:12px; margin-left:-12px; margin-right:-12px; background:var(--neg-tint);
}
.form-item.item-error.form-item-indent{ margin-left:10px; }

.form-bar{
  position:sticky; bottom:0; z-index:10;
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  margin:18px -20px -18px; padding:14px 20px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
}
.form-bar-meta{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-500); }
.form-bar-meta b{ color:var(--ink); font-family:var(--mono); }
.form-error{ color:var(--neg); font-size:11.5px; font-weight:bold; }

.meta-row{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:18px; }
@media (max-width:780px){ .meta-row{ grid-template-columns:1fr; } }
.meta-row .field{ margin-bottom:0; }
.meta-line{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 14px; margin-bottom:18px; border-radius:var(--radius-sm);
  background:var(--wash); border:1px solid var(--line);
  font-size:11.5px; font-weight:bold; color:var(--ink-700);
}
@media (max-width:600px){
  .step-chip .step-title{ display:none; }
  .step-chip{ padding:7px; }
  .stepper{ gap:8px; }
  .zpill{ flex:1 1 auto; text-align:center; }
  .form-bar{ margin-left:-20px; margin-right:-20px; }
  .form-bar .row{ width:100%; }
  .form-bar .row .btn{ flex:1 1 auto; text-align:center; }
}

.summary-group{ margin-bottom:16px; }
.summary-group h4{
  font-size:10px; font-weight:bold; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-500); margin-bottom:8px;
}
.summary-item{
  display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:6px;
  border:1px solid var(--line); background:var(--surface); font-size:12px;
}
.summary-item.bad{ border-color:#EDCCC4; background:var(--neg-tint); }
.summary-item.warn{ border-color:#E8D2AE; background:var(--warn-tint); }
.summary-item .si-note{ font-size:11px; color:var(--ink-700); margin-top:3px; }

/* Toast */
.toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; font-weight:bold; font-size:13px;
  padding:11px 22px; border-radius:var(--pill);
  box-shadow:0 6px 18px rgba(0,0,0,.18); z-index:999;
  animation:toast-in .25s ease-out;
}
.toast.pos{ background:var(--pos); }
.toast.neg{ background:var(--neg); }
@keyframes toast-in{ from{ opacity:0; transform:translate(-50%,-8px); } to{ opacity:1; transform:translate(-50%,0); } }

.draft-note{ display:flex; align-items:center; gap:10px; }
</style>

function seededKm(plate){
  let h = 0;
  for (let i=0;i<plate.length;i++){ h = (h*31 + plate.charCodeAt(i)) >>> 0; }
  return 18000 + (h % 130000);
}

function severity(item, value){
  if (value === "Nicht benötigt") return "na";
  if (item.type === "zahl") return "info";
  if (item.type === "vorhanden_fehlt") return value === "Vorhanden" ? "ok" : "bad";
  if (item.type === "ja_nein") return value === "Nein" ? "ok" : "bad";
  if (value === "Sehr gut" || value === "Gut") return "ok";
  if (value === "Genügend") return "warn";
  return "bad";
}

function responsibility(item){
  if (item.sectionId === "material") return { zustandig:"Werkstatt", frist:"2 Wochen", tage:14 };
  if (item.sectionId === "doku"){

    return { zustandig:"Administration", frist:"3 Tage", tage:3 };
  }
  return { zustandig:"Fahrer", frist:"1 Woche", tage:7 };
}

function defaultAnswers(plate){
  const answers = {};
  FIELD_ITEMS.forEach(item => {
    if (item.type === "zahl"){
      answers[item.key] = { value: seededKm(plate), comment:"", photo:null };
    } else {
      answers[item.key] = { value: GOOD_VALUE[item.type], comment:"", photo:null };
      if (item.hasExpiry) answers[item.key].ablauf = "";
    }
  });
  return answers;
}

/* ---------- Quarter helpers ---------- */

function currentQuarter(d){
  const q = Math.floor(d.getMonth()/3) + 1;
  return "Q" + q + " " + d.getFullYear();
}
function parseQuarter(label){
  const m = label.match(/^Q(\d)\s+(\d{4})$/);
  return { q: parseInt(m[1],10), y: parseInt(m[2],10) };
}
function quarterSortKey(label){ const p = parseQuarter(label); return p.y*4 + (p.q-1); }
function quarterByOffset(baseLabel, offset){
  const p = parseQuarter(baseLabel);
  const idx = p.y*4 + (p.q-1) + offset;
  const ny = Math.floor(idx/4);
  const nq = (idx % 4) + 1;
  return "Q" + nq + " " + ny;
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function quarterMidDate(label){
  const p = parseQuarter(label);
  return isoDate(new Date(p.y, (p.q-1)*3 + 1, 15));
}
function fmtDateCH(iso){
  if (!iso) return "–";
  const parts = iso.split("-");
  return parts[2] + "." + parts[1] + "." + parts[0];
}
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

function answerSeverity(item, answer){
  let sev = severity(item, answer.value);
  if (item.hasExpiry && answer.ablauf && answer.ablauf < isoDate(new Date())){
    if (sev !== "bad") sev = "bad";
  }
  return sev;
}

/* ---------- Seed data ---------- */

function buildSeedState(){
  const today = new Date();
  const todayLabel = currentQuarter(today);
  const inspections = {};
  const mangelStatus = {};
  const offsets = [-3,-2,-1,0];

  DEFAULT_VEHICLES.forEach(v => {
    inspections[v.plate] = offsets.map(off => {
      const qLabel = quarterByOffset(todayLabel, off);
      return {
        quarter: qLabel,
        date: off === 0 ? isoDate(today) : quarterMidDate(qLabel),
        inspector: TEAM[Math.abs(off) % TEAM.length],
        answers: defaultAnswers(v.plate),
        createdAt: Date.now() + off,
      };
    });
  });

  function setAnswer(plate, offsetFromNow, key, value, comment){
    const qLabel = quarterByOffset(todayLabel, offsetFromNow);
    const rec = inspections[plate].find(r => r.quarter === qLabel);
    rec.answers[key] = { value, comment, photo:null };
  }

  setAnswer("ZH 407 814", 0, "hochdruckreiniger", "Defekt", "Pumpe verliert Druck, Wasseraustritt am Anschluss.");
  mangelStatus["ZH 407 814__hochdruckreiniger"] = "Offen";

  setAnswer("ZH 257 777", 0, "beleuchtung", "Ungenügend", "Rücklicht rechts ausgefallen.");
  mangelStatus["ZH 257 777__beleuchtung"] = "In Bearbeitung";

  setAnswer("SH 61 779", 0, "innenraum_sauber", "Genügend", "Leichte Verschmutzung auf dem Boden.");
  setAnswer("ZH 618 345", 0, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("SH 46 254", 0, "aussen_sauber", "Genügend", "Fahrzeug sichtbar verschmutzt, Waschtermin nötig.");
  setAnswer("ZH 312 814", 0, "sitze", "Genügend", "Kleiner Fleck auf dem Fahrersitz.");
  setAnswer("ZH 225 209", 0, "logo_lesbar", "Genügend", "Beschriftung an der Heckklappe leicht verblasst.");
  setAnswer("SH 62 757", 0, "bodenbelag", "Genügend", "Teppich abgenutzt, noch kein Loch.");

  setAnswer("SH 45 499", -1, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("ZH 748 799", -2, "erste_hilfe", "Fehlt", "Kein Erste-Hilfe-Set im Fahrzeug vorgefunden.");
  setAnswer("ZH 748 799", -1, "erste_hilfe", "Vorhanden", "Nachgerüstet, neues Set beschafft.");

  ["SH 57 183", "ZH 945 386", "SH 49 742"].forEach(plate => {
    inspections[plate] = inspections[plate].filter(r => r.quarter !== todayLabel);
  });

  [-8, -16].forEach(off => {
    const qLabel = quarterByOffset(todayLabel, off);
    inspections["ZH 112 737"].push({
      quarter: qLabel, date: quarterMidDate(qLabel), inspector: TEAM[Math.abs(off) % TEAM.length],
      answers: defaultAnswers("ZH 112 737"), createdAt: Date.now() + off,
    });
  });

  ["SH 45 499", "SH 52 620"].forEach(plate => {
    const rec = inspections[plate].find(r => r.quarter === todayLabel);
    ["industriestaubsauger","normaler_sauger","wassersauger","blockmaschine","trittteller","buerste",
     "hochdruckreiniger","hd_zubehoer","sicherheitsgurt","hoehensicherung","helm","alu_leiter"].forEach(key => {
      rec.answers[key] = { value: "Nicht benötigt", comment:"", photo:null, ...(rec.answers[key].ablauf !== undefined ? {ablauf:""} : {}) };
    });
  });

  return { vehicles: DEFAULT_VEHICLES.map(v => ({...v})), inspections, mangelStatus };
}

/* ---------- Storage ---------- */

const STORAGE_KEY = "fleet-data-v3";
let STATE = null;

async function loadState(){
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value){
      STATE = JSON.parse(res.value);
      if (!STATE.vehicles) STATE.vehicles = DEFAULT_VEHICLES.map(v => ({...v}));
      if (!STATE.drafts) STATE.drafts = {};
      return;
    }
  } catch (e) {}
  STATE = buildSeedState();
  STATE.drafts = {};
  await saveState();
}
async function saveState(){
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), true); }
  catch (e){ console.error("Speichern fehlgeschlagen", e); }
}

/* ---------- Derived data ---------- */

function historyList(plate){
  return STATE.inspections[plate].slice().sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter));
}
function latestInspection(plate){ const hist = historyList(plate); return hist[hist.length-1]; }

function severityOfRecord(insp){
  let worst = "ok";
  FIELD_ITEMS.forEach(item => {
    const a = insp.answers[item.key];
    if (!a) return;
    const sev = answerSeverity(item, a);
    if (sev === "bad") worst = "bad";
    else if (sev === "warn" && worst !== "bad") worst = "warn";
  });
  return worst;
}
function vehicleStatus(plate){ return severityOfRecord(latestInspection(plate)); }

function isInspectionDue(plate){
  const latest = latestInspection(plate);
  return quarterSortKey(latest.quarter) < quarterSortKey(currentQuarter(new Date()));
}

function mangelId(plate, key){ return plate + "__" + key; }

function openSince(plate, item){
  const hist = historyList(plate);
  let since = null;
  for (let i = hist.length - 1; i >= 0; i--){
    const a = hist[i].answers[item.key];
    if (!a || answerSeverity(item, a) !== "bad") break;
    since = hist[i];
  }
  return since;
}

function allMangelRows(){
  const rows = [];
  STATE.vehicles.forEach(v => {
    const insp = latestInspection(v.plate);
    FIELD_ITEMS.forEach(item => {
      const a = insp.answers[item.key];
      if (!a) return;
      const sev = answerSeverity(item, a);
      if (sev !== "bad") return;
      const id = mangelId(v.plate, item.key);
      const resp = responsibility(item);
      const status = STATE.mangelStatus[id] || "Offen";
      const fristDate = addDays(insp.date, resp.tage);
      const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date()) && severity(item, a.value) === "ok";
      rows.push({
        id, plate: v.plate, model: v.model, item, value: a.value,
        comment: expired ? "Ablaufdatum überschritten (" + fmtDateCH(a.ablauf) + ")" : a.comment,
        status, zustandig: resp.zustandig, fristLabel: resp.frist, fristDate,
        overdue: status !== "Erledigt" && fristDate < isoDate(new Date()),
        quarter: insp.quarter,
        since: (openSince(v.plate, item) || insp).quarter,
      });
    });
  });
  return rows;
}

function kpiData(){
  let io=0, klein=0, offen=0, faellig=0;
  STATE.vehicles.forEach(v => {
    const s = vehicleStatus(v.plate);
    if (s === "ok") io++; else if (s === "warn") klein++; else offen++;
    if (isInspectionDue(v.plate)) faellig++;
  });
  return { total: STATE.vehicles.length, io, klein, offen, faellig };
}

const SEV_LABEL = { ok:"Mängelfrei", warn:"Kleiner Mangel", bad:"Offener Mangel", na:"Nicht benötigt" };
const SEV_TAG = { ok:"pos", warn:"warn", bad:"neg", na:"idle" };

function plateChip(plate){
  const parts = plate.split(" ");
  return '<span class="plate"><span class="plate-kt">' + parts[0] + '</span><span class="plate-num">' + parts.slice(1).join(" ") + '</span></span>';

function statusDot(sev, big){
  return '<span class="lamp lamp-' + (sev === "na" ? "ok" : sev) + (big ? " lamp-lg" : "") + '"></span>';
}
function statusTag(sev){
  return '<span class="tag ' + SEV_TAG[sev] + '">' + SEV_LABEL[sev] + '</span>';
}

let toastTimer = null;
function toast(message, kind){
  const root = document.getElementById("toast-root");
  if (!root) return;
  root.innerHTML = '<div class="toast ' + (kind||"") + '">' + message + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

function switchView(view){ currentView = view; window.scrollTo(0,0); render(); }

function startInspection(plate){
  inspectForm.plate = plate;
  inspectForm.formOpen = true;
  inspectForm.editingQuarter = currentQuarter(new Date());
  inspectForm.draft = null;
  inspectForm.step = 0;
  inspectForm.errorKeys = []; inspectForm.errorMsg = "";
  inspectForm.lastSavedQuarter = null;
  currentView = "inspect";
  window.scrollTo(0,0);
  render();
}

function validateStep(step){
  if (step === 0 && !(inspectForm.inspector || "").trim()){
    inspectForm.errorKeys = [];
    inspectForm.errorMsg = "Bitte den Namen der kontrollierenden Person eintragen.";
    return false;
  }
  if (step >= SECTIONS.length) return true;
  const keys = missingKeys(SECTIONS[step]);
  inspectForm.errorKeys = keys;
  inspectForm.errorMsg = keys.length
    ? (keys.length === 1 ? "Eine Bemerkung fehlt noch." : keys.length + " Bemerkungen fehlen noch.")
    : "";
  return keys.length === 0;
}

function focusFirstError(){
  const name = document.getElementById("insp-inspector-name");
  if (name && !(inspectForm.inspector || "").trim()){
    name.scrollIntoView({ behavior:"smooth", block:"center" }); name.focus(); return;
  }
  const el = document.querySelector(".item-error textarea");
  if (el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); el.focus(); }
}

    '<div style="padding:0 20px 18px">' + addForm + '</div>' +
  '</div>';
}

function addVehicle(plate, art, model){
  const clean = plate.trim().toUpperCase().replace(/\s+/g, " ");
  if (!clean) return "Bitte ein Kontrollschild angeben.";
  if (STATE.vehicles.some(v => v.plate === clean)) return "Dieses Kontrollschild ist bereits erfasst.";
  if (!model.trim()) return "Bitte ein Fahrzeugmodell angeben.";
  const nextNr = Math.max(0, ...STATE.vehicles.map(v => v.nr || 0)) + 1;
  STATE.vehicles.push({ nr: nextNr, plate: clean, art, model: model.trim() });
  STATE.inspections[clean] = [{ quarter: currentQuarter(new Date()), date: isoDate(new Date()), inspector: TEAM[0], answers: defaultAnswers(clean), createdAt: Date.now() }];
  return null;
}
function removeVehicle(plate){
  STATE.vehicles = STATE.vehicles.filter(v => v.plate !== plate);
  delete STATE.inspections[plate];
  Object.keys(STATE.mangelStatus).forEach(id => { if (id.startsWith(plate + "__")) delete STATE.mangelStatus[id]; });
}

/* ---------- History timeline ---------- */

function renderHistoryTimeline(plate){
  const hist = historyList(plate);
  const latestQ = hist[hist.length-1].quarter;
  const items = hist.map(rec => {
    const sev = severityOfRecord(rec);
    const isLatest = rec.quarter === latestQ;
    return '<div class="tl-item' + (isLatest ? " tl-item-current" : "") + '">' +
      statusDot(sev) +
      '<div class="tl-quarter">' + rec.quarter + '</div>' +
      (isLatest ? '<span class="tl-now-badge">aktuell</span>' : '') +
      '<div class="tl-meta">' + fmtDateCH(rec.date) + '<br/>' + rec.inspector + '</div>' +
      '<button class="btn small" data-action="detail-quarter" data-plate="' + plate + '" data-quarter="' + rec.quarter + '">Ansehen</button>' +
    '</div>';
  }).join('<div class="tl-connector"></div>');
  return '<div class="timeline">' + items + '</div>';
}

/* ---------- Kontrolle durchführen ---------- */

function draftKey(){ return inspectForm.plate + "__" + inspectForm.editingQuarter; }

function ensureDraft(){
  const key = draftKey();
  if (inspectForm.draft && inspectForm.draft._key === key) return;
  const plate = inspectForm.plate;
  const q = inspectForm.editingQuarter;
  const existing = STATE.inspections[plate].find(r => r.quarter === q);
  const stored = STATE.drafts ? STATE.drafts[key] : null;
  if (stored){
    inspectForm.draft = { _key:key, answers: JSON.parse(JSON.stringify(stored.answers)), isEdit: !!existing };
    inspectForm.date = stored.date;
    inspectForm.inspector = stored.inspector;
    inspectForm.inspectorMode = INSPECTORS.indexOf(stored.inspector) >= 0 ? stored.inspector : "andere";
    inspectForm.draftRestored = stored.savedAt;
    return;
  }
  const answers = existing
    ? JSON.parse(JSON.stringify(existing.answers))
    : JSON.parse(JSON.stringify(latestInspection(plate).answers));
  inspectForm.draft = { _key:key, answers, isEdit: !!existing };
  inspectForm.date = existing ? existing.date : isoDate(new Date());
  inspectForm.inspector = existing ? existing.inspector : inspectForm.inspector;
  inspectForm.inspectorMode = INSPECTORS.indexOf(inspectForm.inspector) >= 0 ? inspectForm.inspector : "andere";
  inspectForm.draftRestored = false;
}

let draftTimer = null;
function scheduleDraftSave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    if (!inspectForm.draft || !inspectForm.formOpen) return;
    if (!STATE.drafts) STATE.drafts = {};
    STATE.drafts[inspectForm.draft._key] = {
      answers: inspectForm.draft.answers,
      date: inspectForm.date,
      inspector: inspectForm.inspector,
      savedAt: new Date().toISOString(),
    };
    await saveState();
  }, 1200);
}
function clearDraft(key){
  if (STATE.drafts) delete STATE.drafts[key];
}

/* ---------- Kennzahlen im Erfassungsformular ---------- */

function sectionItems(sec){ return sec.items.filter(it => it.type !== "header"); }

function sectionStats(sec){
  let ok=0, warn=0, bad=0, na=0, missing=0;
  sectionItems(sec).forEach(item => {
    if (item.type === "zahl") return;
    const a = inspectForm.draft.answers[item.key];
    const sv = severity(item, a.value);
    if (sv === "ok") ok++;
    else if (sv === "warn"){ warn++; if (!(a.comment||"").trim()) missing++; }
    else if (sv === "bad"){ bad++; if (!(a.comment||"").trim()) missing++; }
    else na++;
  });
  return { ok, warn, bad, na, missing };
}

function draftTotals(){
  let warn=0, bad=0, missing=0;
  SECTIONS.forEach(sec => {
    const st = sectionStats(sec);
    warn += st.warn; bad += st.bad; missing += st.missing;
  });
  return { warn, bad, missing };
}

function missingKeys(sec){
  const keys = [];
  sectionItems(sec).forEach(item => {
    if (item.type === "zahl") return;
    const a = inspectForm.draft.answers[item.key];
    const sv = severity(item, a.value);
    if ((sv === "warn" || sv === "bad") && !(a.comment||"").trim()) keys.push(item.key);
  });
  return keys;
}

function setSectionOk(secId){
  const sec = SECTIONS.find(x => x.id === secId);
  sectionItems(sec).forEach(item => {
    if (item.type === "zahl") return;
    const a = inspectForm.draft.answers[item.key];
    if (a.value === "Nicht benötigt") return;
    a.value = GOOD_VALUE[item.type];
    a.comment = "";
  });
  inspectForm.errorKeys = []; inspectForm.errorMsg = "";
}

/* ---------- Kontrolle durchführen ---------- */

function renderInspect(){
  if (STATE.vehicles.length === 0){
    return '<header class="page-head"><div><h1>Kontrolle durchführen</h1></div></header><div class="card"><div class="empty"><h3>Keine Fahrzeuge erfasst</h3><p>Bitte zuerst in der Fahrzeugliste ein Fahrzeug hinzufügen.</p></div></div>';
  }
  const v = STATE.vehicles.find(x => x.plate === inspectForm.plate);
  const vehicleOptions = STATE.vehicles.map(x =>
    '<option value="' + x.plate + '"' + (x.plate===inspectForm.plate ? " selected":"") + '>' + x.plate + ' — ' + x.model + '</option>').join("");

  if (!inspectForm.formOpen){
    return '' +
    '<header class="page-head">' +
      '<div><h1>Kontrolle durchführen</h1><p>Fahrzeug wählen, Verlauf prüfen, Kontrolle in fünf Schritten erfassen.</p></div>' +
    '</header>' +
    '<div class="card">' +
      '<div class="field" style="max-width:440px;margin-bottom:0"><label>Fahrzeug</label><select id="insp-plate">' + vehicleOptions + '</select></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h2>Kontroll-Verlauf — ' + v.plate + ' · ' + v.model + '</h2>' +
      '<button class="btn small secondary" data-action="open-archive" data-plate="' + inspectForm.plate + '">Archiv ansehen</button></div>' +
      (isInspectionDue(inspectForm.plate) ? '<div class="note warn" style="margin-bottom:14px">Kontrolle für ' + currentQuarter(new Date()) + ' steht noch aus — letzte erfasste Kontrolle: ' + latestInspection(inspectForm.plate).quarter + '.</div>' : "") +
      renderHistoryTimeline(inspectForm.plate) +
      (inspectForm.lastSavedQuarter ? (function(){
        const ms = mailStatus(inspectForm.plate, inspectForm.lastSavedQuarter);
        return '<div class="row" style="margin-top:14px">' +
          '<button class="btn secondary" data-action="download-pdf" data-plate="' + inspectForm.plate + '" data-quarter="' + inspectForm.lastSavedQuarter + '">PDF herunterladen</button>' +
          '<button class="btn secondary" data-action="send-mail" data-plate="' + inspectForm.plate + '" data-quarter="' + inspectForm.lastSavedQuarter + '">Per Mail senden</button>' +
          (ms ? '<span class="chip-status" style="color:' + (ms.ok ? "var(--pos)" : "var(--neg)") + '">' +
            statusDot(ms.ok ? "ok" : "bad") + (ms.ok ? "Gesendet an " + ms.to : "Versand fehlgeschlagen") + '</span>' : "") +
        '</div>';
      })() : "") +
      '<div class="row" style="margin-top:14px"><button id="open-form-btn" class="btn primary-action">Neue Kontrolle erfassen</button></div>' +
    '</div>';
  }

  /* --- Formular im Schrittmodus --- */
  const baseLabel = currentQuarter(new Date());
  if (!inspectForm.editingQuarter) inspectForm.editingQuarter = baseLabel;
  ensureDraft();

  const lastStep = SECTIONS.length;
  const step = Math.min(inspectForm.step, lastStep);
  const totals = draftTotals();

  const qOptions = [-1,0,1].map(off => quarterByOffset(baseLabel, off));
  const quarterSelect = qOptions.map(ql =>
    '<option value="' + ql + '"' + (ql===inspectForm.editingQuarter ? " selected":"") + '>' + ql + (ql===baseLabel ? " (aktuell)":"") + '</option>').join("");
  const inspectorChips = INSPECTORS.concat(["andere"]).map(t =>
    '<button type="button" class="zpill' + (t===inspectForm.inspectorMode ? " z-ok z-active" : "") + '" data-inspector="' + t + '">' +
    (t === "andere" ? "Andere Person" : t) + '</button>').join("");
  const inspectorField = '<div class="field" style="grid-column:1 / -1">' +
    '<label>Kontrolle durchgeführt von</label>' +
    '<div class="pill-row">' + inspectorChips + '</div>' +
    (inspectForm.inspectorMode === "andere"
      ? '<input id="insp-inspector-name" type="text" style="margin-top:10px;max-width:340px" ' +
        'placeholder="Vor- und Nachname" value="' + (INSPECTORS.indexOf(inspectForm.inspector) >= 0 ? "" : inspectForm.inspector) + '"/>'
      : "") +
  '</div>';

  const stepChips = SECTIONS.map((sec,i) => {
    const st = sectionStats(sec);
    const cls = i === step ? "active" : (st.bad ? "has-bad" : (st.warn ? "has-warn" : (i < step ? "clean" : "")));
    return '<button class="step-chip ' + cls + '" data-step="' + i + '">' +
      '<span class="step-num">' + (i+1) + '</span>' +
      '<span class="step-title">' + sec.title.replace(/^\d+\.\s*/,"") + '</span></button>';
  }).join("") +
  '<button class="step-chip ' + (step === lastStep ? "active" : "") + '" data-step="' + lastStep + '">' +
    '<span class="step-num">' + (lastStep+1) + '</span><span class="step-title">Abschluss</span></button>';

  let body = "";
  if (step < lastStep){
    const sec = SECTIONS[step];
    const st = sectionStats(sec);
    body =
      '<div class="step-head">' +
        '<div><h3>' + sec.title + '</h3>' + (sec.note ? '<p>' + sec.note + '</p>' : "") + '</div>' +
        '<button class="btn secondary" data-action="section-ok" data-section="' + sec.id + '">Alles i.O.</button>' +
      '</div>' +
      (st.bad || st.warn
        ? '<div class="note ' + (st.bad ? "alert" : "warn") + '" style="margin-bottom:16px">In diesem Abschnitt: ' +
          st.bad + ' offene, ' + st.warn + ' kleine Mängel. Zu jedem davon braucht es eine Bemerkung.</div>'
        : "") +
      sec.items.map(item => renderFormItem(item)).join("");
  } else {
    const findings = [];
    SECTIONS.forEach(sec => {
      sectionItems(sec).forEach(item => {
        if (item.type === "zahl") return;
        const a = inspectForm.draft.answers[item.key];
        const sv = severity(item, a.value);
        if (sv !== "warn" && sv !== "bad") return;
        findings.push({ sec, item, a, sv });
      });
    });
    const kmItem = FIELD_ITEMS.find(it => it.type === "zahl");
    const km = kmItem ? inspectForm.draft.answers[kmItem.key].value : null;
    const group = (sv, title) => {
      const list = findings.filter(f => f.sv === sv);
      if (!list.length) return "";
      return '<div class="summary-group"><h4>' + title + ' (' + list.length + ')</h4>' +
        list.map(f => '<div class="summary-item ' + sv + '">' +
          '<div><b>' + f.item.label.replace(/^– /,"") + '</b> — ' + f.a.value +
          '<div class="si-note">' + (f.a.comment || "keine Bemerkung") + '</div></div>' +
          '<span class="tag idle">' + responsibility({...f.item, sectionId:f.sec.id}).zustandig + '</span>' +
        '</div>').join("") + '</div>';
    };
    body =
      '<div class="step-head"><div><h3>Abschluss</h3>' +
        '<p>Kurz prüfen, dann speichern — die Mängel-Liste wird daraus automatisch erzeugt.</p></div></div>' +
      '<div class="kpi-row" style="margin-bottom:20px">' +
        '<div class="kpi"><div class="value pos">' + (FIELD_ITEMS.length - findings.length) + '</div><div class="label">Ohne Beanstandung</div></div>' +
        '<div class="kpi"><div class="value warn">' + totals.warn + '</div><div class="label">Kleine Mängel</div></div>' +
        '<div class="kpi"><div class="value neg">' + totals.bad + '</div><div class="label">Offene Mängel</div></div>' +
        (km !== null ? '<div class="kpi"><div class="value">' + km + '</div><div class="label">Kilometerstand</div></div>' : "") +
      '</div>' +
      (findings.length
        ? group("bad","Offene Mängel") + group("warn","Kleine Mängel")
        : '<div class="all-clear" style="margin-bottom:16px"><span class="ac-icon">✓</span>' +
          '<span>Keine Beanstandung — das Fahrzeug ist in Ordnung.</span></div>');
  }

  const barButtons =
    (step > 0 ? '<button class="btn" id="step-prev">Zurück</button>' : '<button class="btn" id="cancel-inspection">Abbrechen</button>') +
    (step < lastStep
      ? '<button class="btn primary-action" id="step-next">Weiter</button>'
      : '<button class="btn primary-action" id="submit-inspection">Kontrolle speichern</button>');

  const formCard = '<div class="card entry">' +
    '<div class="card-head"><h2>Kontrolle erfassen — ' + v.plate + ' · ' + v.model + '</h2>' +
      '<span class="tag ' + (inspectForm.draft.isEdit ? "warn" : "idle") + '">' +
        (inspectForm.draft.isEdit ? "Bestehende Kontrolle bearbeiten" : "Neue Kontrolle") + '</span></div>' +
    (inspectForm.draftRestored
      ? '<div class="note warn draft-note" style="margin-bottom:16px"><span>Nicht abgeschlossener Entwurf vom ' +
        fmtDateCH(inspectForm.draftRestored.slice(0,10)) + ' wiederhergestellt.</span>' +
        '<button class="btn small" data-action="discard-draft">Entwurf verwerfen</button></div>'
      : "") +
    (step === 0
      ? '<div class="meta-row">' +
          '<div class="field"><label>Quartal</label><select id="insp-quarter">' + quarterSelect + '</select></div>' +
          '<div class="field"><label>Datum</label><input id="insp-date" type="date" value="' + inspectForm.date + '"/></div>' +
          inspectorField +
        '</div>'
      : '<div class="meta-line">' + inspectForm.editingQuarter + ' · ' + fmtDateCH(inspectForm.date) + ' · ' + (inspectForm.inspector || "Name fehlt") +
        '<button class="btn small" data-step="0">Kopfdaten ändern</button></div>') +
    '<div class="stepper">' + stepChips + '</div>' +
    '<div class="progress"><div class="progress-fill" style="width:' + Math.round((step/lastStep)*100) + '%"></div></div>' +
    body +
    '<div class="form-bar">' +
      '<div class="form-bar-meta">' +
        '<span>Schritt <b>' + (step+1) + '</b> von <b>' + (lastStep+1) + '</b></span>' +
        '<span>Kleine Mängel <b>' + totals.warn + '</b></span>' +
        '<span>Offene Mängel <b>' + totals.bad + '</b></span>' +
        (inspectForm.errorMsg ? '<span class="form-error">' + inspectForm.errorMsg + '</span>' : "") +
      '</div>' +
      '<div class="row">' + barButtons + '</div>' +
    '</div>' +
  '</div>';

  return '' +
  '<header class="page-head">' +
    '<div><h1>Kontrolle durchführen</h1><p>' + v.plate + ' · ' + v.model + ' — Quartal ' + inspectForm.editingQuarter + '</p></div>' +
    '<div class="toolbar"><button class="btn" id="cancel-inspection-top">Erfassung schliessen</button></div>' +
  '</header>' +
  formCard;
}

function renderFormItem(item){
  if (item.type === "header"){
    return '<div class="form-subheader">' + item.label + '</div>';
  }
  const a = inspectForm.draft.answers[item.key];
  if (item.type === "zahl"){
    return '<div class="form-item"><div class="form-item-label">' + item.label + '</div>' +
      '<input type="number" data-key="' + item.key + '" class="km-input" value="' + a.value + '" style="width:160px"/> km</div>';
  }
  const sev = severity(item, a.value);
  const optionList = OPTIONS[item.type].concat(item.optionalEquipment ? ["Nicht benötigt"] : []);
  const pills = optionList.map(opt => {
    const s = severity(item, opt);
    return '<button type="button" class="zpill z-' + s + (opt===a.value ? " z-active":"") + '" data-key="' + item.key + '" data-value="' + opt + '">' + opt + '</button>';
  }).join("");
  const needsComment = sev === "warn" || sev === "bad";
  const extra = needsComment ? (
    '<div class="form-extra ' + (sev === "bad" ? "form-extra-bad" : "") + '">' +
      '<textarea class="comment-input" data-key="' + item.key + '" placeholder="Bemerkung (Pflicht) …">' + (a.comment||"") + '</textarea>' +
      '<div class="photo-row">' +
        '<label class="btn small secondary photo-btn">Foto hinzufügen' +
          '<input type="file" accept="image/*" capture="environment" data-key="' + item.key + '" class="photo-input"/></label>' +
        (a.photo
          ? '<span class="photo-chip"><span class="name">' + a.photo + '</span>' +
            '<button type="button" data-action="remove-photo" data-key="' + item.key + '" title="Foto entfernen">×</button></span>'
          : '<span class="photo-hint">optional — öffnet auf dem Handy direkt die Kamera</span>') +
      '</div>' +
    '</div>'
  ) : "";
  const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date());
  const ablaufRow = item.hasExpiry && sev !== "na" ? (
    '<div class="ablauf-row' + (expired ? " expired" : "") + '">Ablaufdatum <input type="date" data-key="' + item.key + '" class="ablauf-input" value="' + (a.ablauf||"") + '"/>' +
      (expired ? ' abgelaufen' : "") + '</div>'
  ) : "";
  const hasError = inspectForm.errorKeys.indexOf(item.key) >= 0;
  return '<div class="form-item' + (item.indent ? " form-item-indent":"") + (hasError ? " item-error":"") + '">' +
    '<div class="form-item-label">' + item.label + '</div>' +
    '<div class="pill-row">' + pills + '</div>' + ablaufRow + extra +
  '</div>';
}

/* ---------- Mängel-Liste ---------- */

function renderMangelListe(){
  const all = allMangelRows();
  const q = mangelSearch.trim().toUpperCase();
  let rows = all.filter(r => {
    if (mangelFilter !== "alle" && r.status !== mangelFilter) return false;
    if (mangelResp !== "alle" && r.zustandig !== mangelResp) return false;
    if (q && !(r.plate + " " + r.model + " " + r.item.label).toUpperCase().includes(q)) return false;
    return true;
  });
  rows.sort((a,b) => (b.overdue?1:0)-(a.overdue?1:0) || a.fristDate.localeCompare(b.fristDate));

  const statusFilters = ["alle","Offen","In Bearbeitung","Erledigt"].map(f =>
    '<button class="' + (f===mangelFilter ? "active" : "") + '" data-filter="' + f + '">' + (f==="alle"?"Alle":f) + '</button>').join("");
  const respFilters = ["alle","Fahrer","Werkstatt","Administration"].map(f =>
    '<button class="' + (f===mangelResp ? "active" : "") + '" data-resp="' + f + '">' + (f==="alle"?"Alle":f) + '</button>').join("");

  const openCount = all.filter(r => r.status !== "Erledigt").length;
  const overdueCount = all.filter(r => r.overdue).length;

  return '<header class="page-head">' +
      '<div><h1>Mängel-Liste</h1><p>' + openCount + ' offen, davon ' + overdueCount + ' über Frist.</p></div>' +
      '<div class="toolbar"><input id="mangel-search" type="text" placeholder="Suche Fahrzeug oder Prüfpunkt …" value="' + mangelSearch + '" style="width:260px"/></div>' +
    '</header>' +
    '<div class="filter-bar">' +
      '<div class="segment"><span class="segment-label">Status</span>' + statusFilters + '</div>' +
      '<div class="segment"><span class="segment-label">Zuständig</span>' + respFilters + '</div>' +
    '</div>' +
    '<div class="card flush"><div style="padding:0 20px 18px">' + renderMangelTable(rows, false) + '</div></div>';
}

/* ---------- Archiv ---------- */

function yearsWithData(plate){
  const years = new Set(historyList(plate).map(r => parseQuarter(r.quarter).y));
  return Array.from(years).sort((a,b) => a-b);
}

function renderArchive(){
  if (STATE.vehicles.length === 0){
    return '<header class="page-head"><div><h1>Archiv</h1></div></header><div class="card"><div class="empty"><h3>Keine Fahrzeuge erfasst</h3></div></div>';
  }
  const plate = archiveState.plate;
  const v = STATE.vehicles.find(x => x.plate === plate);
  const vehicleOptions = STATE.vehicles.map(x =>
    '<option value="' + x.plate + '"' + (x.plate===plate ? " selected":"") + '>' + x.plate + ' — ' + x.model + '</option>').join("");

  const hist = historyList(plate);
  const year = archiveState.year;
  const years = yearsWithData(plate);
  if (!years.includes(new Date().getFullYear())) years.push(new Date().getFullYear());
  years.sort((a,b) => a-b);

  const yearChips = years.map(y =>
    '<button class="year-chip' + (y===year ? " year-chip-active":"") + '" data-action="archive-year" data-year="' + y + '">' + y + '</button>').join("");

  const quarterCards = [1,2,3,4].map(qn => {
    const label = "Q" + qn + " " + year;
    const rec = hist.find(r => r.quarter === label);
    if (!rec) return '<div class="quarter-card"><div class="quarter-card-title">' + label + '</div><div class="quarter-card-empty">keine Kontrolle erfasst</div></div>';
    const sev = severityOfRecord(rec);
    return '<div class="quarter-card q-' + sev + '"><div class="quarter-card-title">' + label + '</div>' +
      '<div class="chip-status" style="justify-content:center">' + statusDot(sev) + SEV_LABEL[sev] + '</div>' +
      '<div class="hint" style="margin:6px 0">' + fmtDateCH(rec.date) + '<br/>' + rec.inspector + '</div>' +
      '<button class="btn small" data-action="detail-quarter" data-plate="' + plate + '" data-quarter="' + label + '">Ansehen</button></div>';
  }).join("");

  const recorded = [1,2,3,4].filter(qn => hist.some(r => r.quarter === "Q" + qn + " " + year));
  const summary = recorded.length === 0 ? 'Für ' + year + ' liegen noch keine Kontrollen vor.' : recorded.length + ' von 4 Quartalen kontrolliert in ' + year + '.';

  return '' +
  '<header class="page-head"><div><h1>Archiv</h1><p>Vollständiger, jahresweiser Verlauf pro Fahrzeug.</p></div></header>' +
  '<div class="card"><div class="field" style="max-width:440px;margin:0"><label>Fahrzeug</label><select id="archive-plate">' + vehicleOptions + '</select></div></div>' +
  '<div class="card">' +
    '<div class="year-nav"><button class="year-nav-btn" data-action="archive-prev-year">‹</button>' +

/* ---------- Einstellungen ---------- */

function renderSettings(){
  const st = mailSettings();
  const log = Object.entries(STATE.mailLog || {})
    .sort((a,b) => (b[1].sentAt || "").localeCompare(a[1].sentAt || ""))
    .slice(0, 12);

  const logRows = log.length
    ? log.map(([key, e]) => {
        const [plate, quarter] = key.split("__");
        return '<tr class="sev-' + (e.ok ? "ok" : "bad") + '">' +
          '<td>' + plateChip(plate) + '</td>' +
          '<td class="text">' + quarter + '</td>' +
          '<td class="text">' + fmtDateCH((e.sentAt||"").slice(0,10)) + '</td>' +
          '<td class="text status-cell">' + statusDot(e.ok ? "ok" : "bad") + (e.ok ? "Gesendet" : "Fehlgeschlagen") + '</td>' +
          '<td class="text hint">' + (e.error || e.to || "") + '</td>' +
          '<td class="text">' + (e.ok ? "" :
            '<button class="btn small secondary" data-action="send-mail" data-plate="' + plate + '" data-quarter="' + quarter + '">Erneut senden</button>') + '</td>' +
        '</tr>';
      }).join("")
    : '<tr class="empty-row"><td colspan="6" class="text"><span class="hint">Noch kein Versand erfasst.</span></td></tr>';

  return '' +
  '<header class="page-head">' +
    '<div><h1>Einstellungen</h1><p>Automatischer Versand der Inspektionsberichte.</p></div>' +
  '</header>' +
  '<div class="card">' +
    '<h2>Versand der Berichte</h2>' +
    '<div class="desc">Nach jeder gespeicherten Kontrolle wird das PDF erzeugt und an die hinterlegte Adresse geschickt.</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Empfängeradresse</label>' +
        '<input type="text" id="set-mailto" value="' + st.mailTo + '"/>' +
        '<div class="hint">Kanaladresse in Microsoft Teams.</div></div>' +
      '<div class="field"><label>Versandweg</label>' +
        '<div class="note" style="margin-top:2px">Resend über die Serverfunktion <b>/api/send-report</b>. ' +
        'Absenderdomain und Schlüssel liegen als Umgebungsvariablen im Vercel-Projekt, nicht in dieser Seite.</div></div>' +
    '</div>' +
    '<label class="check"><input type="checkbox" id="set-autosend"' + (st.autoSend ? " checked" : "") + '/>' +
      'Bericht nach dem Speichern automatisch senden</label>' +
    '<div class="row" style="margin-top:14px">' +
      '<button class="btn primary-action" id="set-save">Einstellungen speichern</button>' +
      '<button class="btn secondary" id="set-test">Testversand mit letzter Kontrolle</button>' +
    '</div>' +
  '</div>' +
  '<div class="card flush">' +
    '<div class="card-head"><h2>Versandprotokoll</h2><span class="tag idle">letzte 12 Vorgänge</span></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th>Fahrzeug</th><th class="text">Quartal</th><th class="text">Datum</th><th class="text">Status</th><th class="text">Hinweis</th><th class="text"></th>' +
    '</tr></thead><tbody>' + logRows + '</tbody></table></div>' +
    '<div style="padding:0 20px 18px"></div>' +
  '</div>';
}

/* ---------- Vehicle detail modal ---------- */

function openDetail(plate, quarterLabel){
  const v = STATE.vehicles.find(x => x.plate === plate);
  const hist = historyList(plate);
  const insp = quarterLabel ? hist.find(r => r.quarter === quarterLabel) : hist[hist.length-1];
  const sev = severityOfRecord(insp);
  const isLatest = insp.quarter === hist[hist.length-1].quarter;
  const rowsHtml = FIELD_ITEMS.map(item => {
    const a = insp.answers[item.key];
    if (!a) return "";
    const s = severity(item, a.value);
    if (item.type === "zahl") return '<tr><td class="text">' + item.label + '</td><td class="text" colspan="2">' + a.value + ' km</td></tr>';
    const ablaufText = item.hasExpiry && a.ablauf ? ('<div class="hint">Ablauf: ' + fmtDateCH(a.ablauf) + '</div>') : "";
    return '<tr class="sev-' + (s === "na" ? "ok" : s) + '"><td class="text">' + item.label.replace(/^– /,"") + '</td>' +
      '<td class="text"><span class="tag ' + SEV_TAG[s] + '">' + a.value + '</span>' + ablaufText + '</td>' +
      '<td class="text hint">' + (a.comment || "–") + '</td></tr>';
  }).join("");

  document.getElementById("modal-root").innerHTML =
    '<div class="modal-overlay" id="modal-backdrop"><div class="modal">' +
      '<button class="modal-close" id="modal-close">✕</button>' +
      '<h2>' + plateChip(plate) + ' ' + v.model + ' <span class="hint">(' + v.art + ')</span></h2>' +
      '<div class="status-banner ' + sev + '">' + statusDot(sev, true) + SEV_LABEL[sev] +
        '<span style="margin-left:auto;font-weight:normal;font-size:11.5px">Stand ' + insp.quarter + '</span></div>' +
      '<h3 style="font-size:13px;margin-bottom:8px">Kontrolle — ' + insp.quarter + (isLatest ? " (aktuell)" : "") + '</h3>' +
      '<div class="table-wrap"><table><tbody>' + rowsHtml + '</tbody></table></div>' +
      '<h3 style="font-size:13px;margin:18px 0 8px">Verlauf</h3>' +
      renderHistoryTimeline(plate) +
      '<div class="row" style="margin-top:16px">' +
        '<button class="btn secondary" data-action="open-archive" data-plate="' + plate + '">Archiv ansehen</button>' +
        '<button class="btn secondary" data-action="download-pdf" data-plate="' + plate + '" data-quarter="' + insp.quarter + '">PDF herunterladen</button>' +
        '<button class="btn secondary" data-action="send-mail" data-plate="' + plate + '" data-quarter="' + insp.quarter + '">Per Mail senden</button>' +
        '<button class="btn primary-action" id="detail-inspect-btn" data-plate="' + plate + '">Neue Kontrolle für dieses Fahrzeug</button>' +
      '</div>' +
    '</div></div>';

  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop" || e.target.id === "modal-close") closeDetail();
  });
  document.getElementById("detail-inspect-btn").addEventListener("click", () => {
    closeDetail();
    inspectForm.plate = plate; inspectForm.formOpen = true; inspectForm.editingQuarter = currentQuarter(new Date());
    inspectForm.draft = null; inspectForm.successMsg = null;
    switchView("inspect");
  });
  document.querySelectorAll('.modal [data-action="detail-quarter"]').forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.plate, el.dataset.quarter));
  });
  document.querySelectorAll('.modal [data-action="open-archive"]').forEach(el => {
    el.addEventListener("click", () => { closeDetail(); archiveState.plate = el.dataset.plate; archiveState.year = new Date().getFullYear(); switchView("archive"); });
  });
  document.querySelectorAll('.modal [data-action="download-pdf"]').forEach(el => {
    el.addEventListener("click", () => downloadPdfFromButton(el));
  });
  document.querySelectorAll('.modal [data-action="send-mail"]').forEach(el => {
    el.addEventListener("click", () => sendMailFromButton(el));
  });
}
function closeDetail(){ document.getElementById("modal-root").innerHTML = ""; }

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("modal-root").innerHTML) closeDetail();
});
document.addEventListener("click", (e) => {
  if (e.target && e.target.classList && e.target.classList.contains("modal-overlay")) closeDetail();
});

async function downloadPdfFromButton(el){
  const label = el.textContent;
  el.disabled = true;
  el.textContent = "PDF wird erstellt …";
  try { await generateInspectionPDF(el.dataset.plate, el.dataset.quarter); }
  finally { el.disabled = false; el.textContent = label; }
}

/* ---------- PDF export (Clean-Service-Briefkopf) ---------- */

/* Verdana darf lizenzrechtlich nicht eingebettet werden — im PDF steht
   deshalb DejaVu Sans, das der Verdana-Anmutung am nächsten kommt.
   Der Font wird beim ersten PDF einmalig geladen und danach zwischengespeichert. */
const DEJAVU_CDN = "https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/";
let PDF_FONT = null;
let DEJAVU_CACHE = null;

async function ensurePdfFont(doc){
  if (PDF_FONT === "helvetica") return "helvetica";
  try {
    if (!DEJAVU_CACHE){
      const load = async (file) => {
        const res = await fetch(DEJAVU_CDN + file);
        if (!res.ok) throw new Error("HTTP " + res.status + " bei " + file);
        const bytes = new Uint8Array(await res.arrayBuffer());
        let bin = "";
        for (let i=0; i<bytes.length; i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
        return btoa(bin);
      };
      const [normal, bold] = await Promise.all([load("DejaVuSans.ttf"), load("DejaVuSans-Bold.ttf")]);
      DEJAVU_CACHE = { normal, bold };
    }
    doc.addFileToVFS("DejaVuSans.ttf", DEJAVU_CACHE.normal);
    doc.addFont("DejaVuSans.ttf", "DejaVuSans", "normal");
    doc.addFileToVFS("DejaVuSans-Bold.ttf", DEJAVU_CACHE.bold);
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVuSans", "bold");
    PDF_FONT = "DejaVuSans";
  } catch (e){
    console.warn("DejaVu Sans nicht verfügbar — PDF wird in Helvetica erstellt.", e);
    PDF_FONT = "helvetica";
  }
  return PDF_FONT;
}
