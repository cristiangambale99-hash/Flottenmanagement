<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flottenmanagement | Clean Service Scaramuzzo AG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =====================================================================
   Clean Service Scaramuzzo AG — App-Layout
   Übernommen aus cs-reporting, materialbestellungen und angebot-pfs:
   Türkis-Skala aus dem CD, heller Verlaufshintergrund mit Tropfen-Dekor,
   schwebende App-Fläche, weiche Karten mit grossen Radien, Pill-Navigation,
   Kapitälchen-Mikrotypografie und Monospace-Zahlen.
   ===================================================================== */

:root{
  color-scheme: light only;

  /* Corporate Design — Türkis-Skala */
  --brand:#2BB6B7;
  --brand-600:#22A0A1;
  --brand-700:#1B8384;
  --brand-800:#146061;
  --brand-50:#EAF8F8;
  --brand-100:#D3F0F1;
  --brand-200:#A8E1E2;
  --brand-300:#7DD2D3;

  /* Text und Linien */
  --ink:#1B2B32;
  --ink-700:#3A4C54;
  --ink-500:#647178;
  --ink-300:#A7B0B4;
  --line:#EDF1F2;
  --line-strong:#E1EAE9;

  /* Flächen */
  --surface:#FFFFFF;
  --bg:#FBFDFC;
  --wash:#F4F9F9;

  /* Signalfarben */
  --pos:#2E9E5B;        --pos-tint:#E6F4EC;
  --warn:#C98A3E;       --warn-tint:#F6EBD9;
  --neg:#B8503E;        --neg-tint:#F8E8E4;

  /* Tiefe und Form */
  --shadow-sm:0 1px 2px rgba(23,37,31,.05);
  --shadow:0 1px 2px rgba(23,37,31,.04), 0 6px 16px rgba(23,37,31,.06);
  --shadow-lg:0 4px 10px rgba(23,37,31,.05), 0 24px 48px -24px rgba(23,37,31,.22);
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:22px;
  --pill:999px;

  --ui:Verdana, Geneva, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

*{ box-sizing:border-box; }

html, body{ margin:0; padding:0; min-height:100%; }

body{
  font-family:var(--ui);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 12% 15%, rgba(255,255,255,0.16), transparent 38%),
    radial-gradient(circle at 88% 82%, rgba(190,226,233,0.35), transparent 45%),
    radial-gradient(circle at 92% 8%, rgba(96,190,179,0.4), transparent 35%),
    linear-gradient(150deg, #0b5354 0%, #0f7274 22%, #2bb6b7 52%, #63c2bc 78%, #a7dad6 100%);
  background-attachment:fixed;
  position:relative;
}

h1,h2,h3,p{ margin:0; }
a{ color:var(--brand-700); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--brand-200); border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }

@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ============ Hintergrund-Dekor ============ */
.brand-bg-decor{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.decor-drop{ position:absolute; opacity:.16; filter:blur(1px); }
.decor-drop-1{ width:640px; height:640px; top:-180px; left:-220px; transform:rotate(200deg); }
.decor-drop-2{ width:520px; height:520px; bottom:-200px; right:-160px; transform:rotate(15deg); opacity:.22; }

/* ============ App-Fläche ============ */
.app{
  position:relative; z-index:1;
  max-width:1180px; margin:40px auto;
  background:var(--bg);
  border-radius:var(--radius-lg);
  box-shadow:0 30px 70px rgba(4,40,40,.35), 0 8px 22px rgba(4,40,40,.18);
  overflow:hidden;
}

.app-bar{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 28px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:11px; }
.brand img{ height:34px; width:auto; display:block; }
.brand-name{ font-size:13px; font-weight:bold; letter-spacing:-.01em; line-height:1.25; }
.brand-sub{
  font-size:9.5px; font-weight:bold; letter-spacing:.14em; text-transform:uppercase;
  color:var(--brand-700); margin-top:3px;
}
.nav-pills{ display:flex; gap:6px; flex-wrap:wrap; }
.nav-pills button{
  padding:7px 15px; border-radius:var(--pill);
  border:1px solid var(--line); background:var(--surface);
  font-family:inherit; font-size:12px; font-weight:bold; color:var(--ink-500);
  cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.nav-pills button:hover{ border-color:var(--brand-300); color:var(--ink); }
.nav-pills button:active{ transform:scale(.97); }
.nav-pills button.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.app-meta{ font-size:10.5px; color:var(--ink-500); line-height:1.5; text-align:right; }

.due-strip{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:11px 28px; background:var(--brand-50);
  border-bottom:1px solid var(--line);
  font-size:11.5px; color:var(--ink-500);
}
.due-strip-label{
  font-size:9.5px; font-weight:bold; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand-700);
}
.due-chip{
  all:unset; cursor:pointer;
  padding:4px 11px; border-radius:var(--pill);
  border:1px solid var(--brand-200); background:var(--surface);
  font-size:11.5px; font-weight:bold; color:var(--ink);
}
.due-chip:hover{ border-color:var(--brand); background:var(--brand-50); }

main{ display:block; padding:28px 28px 48px; animation:fadeSlideIn .22s ease-out; }

/* ============ Seitenkopf ============ */
header.page-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  flex-wrap:wrap; gap:16px;
  margin-bottom:22px; padding-bottom:16px;
  border-bottom:2px solid var(--ink);
}
header.page-head h1{ font-size:26px; font-weight:bold; letter-spacing:-.015em; }
header.page-head p{ color:var(--ink-500); font-size:12px; margin-top:5px; }
.toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* ============ Buttons ============ */
.btn{
  background:var(--surface); color:var(--ink-500);
  border:1px solid var(--line); border-radius:var(--pill);
  padding:8px 15px; font-family:inherit; font-size:12px; font-weight:bold;
  cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:hover{ border-color:var(--brand-300); color:var(--ink); }
.btn:active{ transform:scale(.97); }
.btn.primary-action{ background:var(--brand); border-color:var(--brand); color:#fff; padding:10px 20px; }
.btn.primary-action:hover{ background:var(--brand-600); border-color:var(--brand-600); color:#fff; }
.btn.secondary{ background:var(--brand-50); border-color:var(--brand-200); color:var(--brand-700); }
.btn.secondary:hover{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.danger{ background:var(--neg); border-color:var(--neg); color:#fff; }
.btn.danger:hover{ background:#A03F2E; border-color:#A03F2E; color:#fff; }
.btn.small{ padding:5px 11px; font-size:11px; }
.btn.danger.small{ background:var(--neg-tint); border-color:#EDCCC4; color:var(--neg); }
.btn.danger.small:hover{ background:var(--neg); border-color:var(--neg); color:#fff; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

/* ============ Kennzahlen ============ */
.kpi-row{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
  gap:12px; margin-bottom:22px;
}
.kpi{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; text-align:center;
}
.kpi .label{
  font-size:10px; color:var(--ink-500); margin-top:5px;
  text-transform:uppercase; letter-spacing:.05em; font-weight:bold;
}
.kpi .value{ font-family:var(--mono); font-size:26px; font-weight:bold; color:var(--brand-600); }
.kpi .value.pos{ color:var(--pos); }
.kpi .value.warn{ color:var(--warn); }
.kpi .value.neg{ color:var(--neg); }
.kpi .value.due{ color:var(--ink-500); }
.kpi .value .unit{ font-size:12px; font-weight:normal; color:var(--ink-500); margin-left:3px; }
.kpi .sub{ font-size:10.5px; color:var(--ink-500); margin-top:4px; }

/* ============ Karten ============ */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px 20px; margin-bottom:16px; overflow:hidden;
}
.card h2{ font-size:15px; font-weight:bold; }
.card .desc{ font-size:11.5px; color:var(--ink-500); margin-bottom:14px; }
.card-head{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
}
.card-head h2{ margin-bottom:0; }
.card.flush{ padding:0; }

/* Getönter Kartenkopf */
.card > .card-head,
.card > h2:first-child{
  margin:-18px -20px 16px; padding:14px 20px;
  background:var(--brand-50);
  border-bottom:1px solid var(--line);
  color:var(--ink);
}
.card > h2:first-child:has(+ .desc){ margin-bottom:0; padding-bottom:5px; border-bottom:0; }
.card > h2:first-child:has(+ .desc) + .desc{
  margin:0 -20px 16px; padding:0 20px 13px;
  background:var(--brand-50); border-bottom:1px solid var(--line);
}
.card.flush > .card-head{ margin:0 0 14px; padding:14px 20px; }
.card.flush > .table-wrap th:first-child,
.card.flush > .table-wrap td:first-child{ padding-left:20px; }
.card.flush > .table-wrap th:last-child,
.card.flush > .table-wrap td:last-child{ padding-right:20px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-sidebar{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
.stack > * + *{ margin-top:14px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hint{ font-size:10.5px; color:var(--ink-500); margin-top:3px; }

/* ============ Tabellen ============ */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th, td{ padding:9px 11px; text-align:right; vertical-align:top; }
th:first-child, td:first-child{ text-align:left; }
th{
  font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-500); background:none; white-space:nowrap;
  border-bottom:1px solid var(--line-strong);
}
td{ border-bottom:1px solid var(--line); }
tbody tr:hover{ background:var(--wash); }
tfoot td{ font-weight:bold; background:var(--wash); border-top:1px solid var(--brand-200); }
td.text, th.text{ text-align:left; }
tr.clickable{ cursor:pointer; }
tr.row-overdue{ background:var(--neg-tint); }
tr.row-overdue:hover{ background:#F5DED8; }

/* ============ Tags ============ */
.tag{
  display:inline-block; font-size:10px; font-weight:bold; padding:3px 9px;
  border-radius:var(--pill); white-space:nowrap;
  background:var(--brand-50); color:var(--brand-700); border:1px solid var(--brand-200);
}
.tag.pos{ background:var(--pos-tint); color:var(--pos); border-color:#C9E6D5; }
.tag.warn{ background:var(--warn-tint); color:#9A6720; border-color:#E8D2AE; }
.tag.neg{ background:var(--neg-tint); color:var(--neg); border-color:#EDCCC4; }
.tag.idle{ background:var(--line); color:var(--ink-500); border-color:var(--line-strong); }

/* ============ Formulare ============ */
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:10px; font-weight:bold; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-500); margin-bottom:5px;
}
.field .hint{ font-size:10.5px; color:var(--ink-300); margin-top:4px; }
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:9px 11px;
}
textarea{ min-height:70px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--brand-300);
  box-shadow:0 0 0 3px var(--brand-100);
}
.check{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:10px; cursor:pointer; }
.check input{ width:16px; height:16px; accent-color:var(--brand); }

/* XL-Erfassung für Mitarbeitende vor Ort */
.entry input, .entry select{ font-size:15px; padding:13px 12px; }
.entry .btn.primary-action{ padding:14px 24px; font-size:14px; }

/* ============ Hinweise, Leerzustand ============ */
.note{
  border:1px solid var(--brand-200); background:var(--brand-50);
  padding:12px 15px; border-radius:var(--radius-sm);
  font-size:11.5px; line-height:1.55; color:var(--ink-700);
}
.note.warn{ border-color:#E8D2AE; background:var(--warn-tint); }
.note.alert{ border-color:#EDCCC4; background:var(--neg-tint); }
.empty{ padding:44px 20px; text-align:center; color:var(--ink-500); font-size:12.5px; }
.empty h3{ font-size:14px; color:var(--ink); margin-bottom:6px; }

/* ============ Dialog ============ */
.modal-overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(27,43,50,.6);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  width:min(660px,100%); max-height:88vh; overflow:auto;
  background:var(--surface); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:24px 26px; position:relative;
  animation:fadeSlideIn .22s ease-out;
}
.modal h2{ font-size:16px; margin-bottom:16px; }
.modal-close{
  all:unset; cursor:pointer; position:absolute; top:18px; right:20px;
  width:30px; height:30px; border-radius:var(--pill);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--ink-700); background:var(--line);
}
.modal-close:hover{ background:var(--brand-100); color:var(--brand-800); }

/* ============ Reiter ============ */
.tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.tabs button{
  padding:7px 15px; border:1px solid var(--line); background:var(--surface);
  border-radius:var(--pill); font-family:inherit; font-size:12px; font-weight:bold;
  color:var(--ink-500); cursor:pointer; white-space:nowrap;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.tabs button:hover{ border-color:var(--brand-300); color:var(--ink); }
.tabs button:active{ transform:scale(.97); }
.tabs button.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

/* ============ Druck ============ */
@media print{
  @page{ size:A4 portrait; margin:14mm 14mm 18mm; }
  body{ background:#fff; font-size:10pt; }
  .brand-bg-decor, .app-bar, .due-strip, .toolbar, .no-print, .btn{ display:none !important; }
  .app{ margin:0; max-width:none; box-shadow:none; border-radius:0; background:#fff; }
  main{ padding:0; }
  .card{ break-inside:avoid; box-shadow:none; }
  .kpi, .card, .tag, th{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}

/* ============ Mobil ============ */
@media (max-width:900px){
  .app{ margin:0; border-radius:0; }
  .app-bar{ padding:12px 16px; }
  .app-meta{ display:none; }
  .due-strip{ padding:10px 16px; }
  main{ padding:20px 16px 40px; }
  .grid-2, .grid-sidebar{ grid-template-columns:1fr; }
  .quarter-grid{ grid-template-columns:1fr 1fr !important; }
}

/* =====================================================================
   Flottenmanagement — app-eigene Bausteine auf denselben Tokens
   ===================================================================== */

/* Swiss-Kontrollschild-Chip (Signatur-Element dieser App) */
.plate{
  display:inline-flex; align-items:stretch; border-radius:4px; overflow:hidden;
  border:1.3px solid var(--ink); font-family:var(--ui);
  font-weight:bold; font-size:11.5px; background:#fff; color:var(--ink); height:20px;
}
.plate-kt{ background:#0B4EA2; color:#fff; padding:0 5px; display:flex; align-items:center; font-size:9.5px; }
.plate-num{ padding:0 6px; display:flex; align-items:center; letter-spacing:.02em; }

/* Ampel-Übersicht (Fahrzeug-Kachelraster) */
.fleet-chip-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:10px; }
.fleet-chip{
  all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.fleet-chip:hover{ border-color:var(--brand-300); box-shadow:var(--shadow); transform:translateY(-1px); }
.fleet-chip-model{ font-size:10.5px; color:var(--ink-500); }
.fleet-chip-ok{ border-left:3px solid var(--pos); }
.fleet-chip-warn{ border-left:3px solid var(--warn); }
.fleet-chip-bad{ border-left:3px solid var(--neg); }
.fleet-chip-due{ outline:1.5px dashed var(--ink-300); outline-offset:-1px; }

/* Status-Punkt */
.dot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.dot-ok{ background:var(--pos); } .dot-warn{ background:var(--warn); } .dot-bad{ background:var(--neg); }

/* Zustands-Pillen im Kontrollformular */
.pill-row{ display:flex; flex-wrap:wrap; gap:6px; }
.zpill{
  all:unset; cursor:pointer; font-size:12px; font-weight:bold; padding:8px 14px;
  border-radius:var(--pill); border:1px solid var(--line-strong);
  color:var(--ink-500); background:var(--surface);
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.zpill:active{ transform:scale(.96); }
.zpill.z-ok.z-active{ background:var(--pos); border-color:var(--pos); color:#fff; }
.zpill.z-warn.z-active{ background:var(--warn); border-color:var(--warn); color:#fff; }
.zpill.z-bad.z-active{ background:var(--neg); border-color:var(--neg); color:#fff; }
.zpill.z-na.z-active{ background:var(--ink-300); border-color:var(--ink-300); color:#fff; }
.zpill:not(.z-active):hover{ border-color:var(--brand-300); color:var(--ink); }

.form-item{ margin-bottom:16px; }
.form-item-label{ font-size:12.5px; font-weight:bold; margin-bottom:8px; }
.form-item-indent{ margin-left:22px; }
.form-subheader{
  font-weight:bold; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand-700); margin:20px 0 8px; padding-top:14px;
  border-top:1px solid var(--line);
}
.form-extra{
  margin-top:9px; padding:10px 12px; border-radius:var(--radius-sm);
  border:1px solid #E8D2AE; background:var(--warn-tint);
}
.form-extra-bad{ border-color:#EDCCC4; background:var(--neg-tint); }
.ablauf-row{
  display:flex; align-items:center; gap:8px; font-size:11.5px;
  color:var(--ink-500); font-weight:bold; margin-top:9px;
}
.ablauf-row input{ width:auto; }
.ablauf-row.expired{ color:var(--neg); }
.ablauf-row.expired input{ border-color:var(--neg); }

/* Kontroll-Verlauf (Zeitleiste über Quartale) */
.timeline{ display:flex; align-items:flex-start; overflow-x:auto; padding:6px 2px 4px; }
.tl-item{
  display:flex; flex-direction:column; align-items:center; min-width:118px; flex-shrink:0;
  text-align:center; padding:10px 8px; border-radius:var(--radius-sm);
}
.tl-item-current{ background:var(--brand-50); }
.tl-quarter{ font-family:var(--mono); font-weight:bold; font-size:12.5px; margin-top:5px; }
.tl-now-badge{
  background:var(--brand); color:#fff; font-size:9px; font-weight:bold;
  padding:2px 8px; border-radius:var(--pill); text-transform:uppercase;
  margin-top:4px; display:inline-block; letter-spacing:.06em;
}
.tl-meta{ margin:5px 0 6px; line-height:1.45; font-size:10.5px; color:var(--ink-500); }
.tl-connector{ flex:0 0 26px; height:2px; background:var(--line-strong); margin-top:24px; align-self:flex-start; }

/* Archiv */
.year-nav{ display:flex; align-items:center; gap:10px; margin-bottom:6px; font-family:var(--mono); }
.year-nav-btn{
  all:unset; cursor:pointer; width:30px; height:30px; border-radius:var(--radius-sm);
  border:1px solid var(--line-strong); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:bold; color:var(--ink);
}
.year-nav-btn:hover{ background:var(--brand); border-color:var(--brand); color:#fff; }
.year-nav-label{ font-size:17px; font-weight:bold; min-width:64px; text-align:center; }
.year-chips{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
.year-chip{
  all:unset; cursor:pointer; font-size:11.5px; font-weight:bold; padding:5px 13px;
  border-radius:var(--pill); border:1px solid var(--line); background:var(--surface); color:var(--ink-500);
}
.year-chip:hover{ border-color:var(--brand-300); color:var(--ink); }
.year-chip-active{ background:var(--ink); border-color:var(--ink); color:#fff; }
.year-summary{ color:var(--ink-500); font-size:12px; margin-bottom:14px; }
.quarter-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.quarter-card{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 12px;
  text-align:center; background:var(--surface); box-shadow:var(--shadow-sm);
}
.quarter-card-title{ font-family:var(--mono); font-weight:bold; font-size:13px; margin-bottom:8px; }
.quarter-card-empty{ color:var(--ink-300); font-size:11.5px; padding:8px 0; }

.add-vehicle-form{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px;
  background:var(--brand-50); border:1px solid var(--brand-100);
  padding:16px; border-radius:var(--radius-sm); margin-top:14px;
}
.add-vehicle-form .field{ margin-bottom:0; }
.due-badge{
  font-size:9.5px; font-weight:bold; color:var(--ink-500); background:var(--line);
  padding:2px 8px; border-radius:var(--pill); letter-spacing:.04em;
}
</style>

    ]},

const ALL_ITEMS = SECTIONS.flatMap(s => s.items.map(it => ({...it, sectionId:s.id, sectionTitle:s.title})));
const FIELD_ITEMS = ALL_ITEMS.filter(it => it.type !== "header");

function seededKm(plate){
  let h = 0;
  for (let i=0;i<plate.length;i++){ h = (h*31 + plate.charCodeAt(i)) >>> 0; }
  return 18000 + (h % 130000);
}

function severity(item, value){
  if (value === "Nicht benötigt") return "na";
  if (item.type === "zahl") return "info";
  if (item.type === "vorhanden_fehlt") return value === "Vorhanden" ? "ok" : "bad";
  if (item.type === "ja_nein") return value === "Nein" ? "ok" : "bad";
  if (value === "Sehr gut" || value === "Gut") return "ok";
  if (value === "Genügend") return "warn";
  return "bad";
}

function responsibility(item){
  if (item.sectionId === "material") return { zustandig:"Werkstatt", frist:"2 Wochen", tage:14 };
  if (item.sectionId === "doku"){
    if (item.key === "service_faellig") return { zustandig:"Werkstatt", frist:"1 Woche", tage:7 };
    return { zustandig:"Administration", frist:"3 Tage", tage:3 };
  }
  return { zustandig:"Fahrer", frist:"1 Woche", tage:7 };
}

function defaultAnswers(plate){
  const answers = {};
  FIELD_ITEMS.forEach(item => {
    if (item.type === "zahl"){
      answers[item.key] = { value: seededKm(plate), comment:"", photo:null };
    } else {
      answers[item.key] = { value: GOOD_VALUE[item.type], comment:"", photo:null };
      if (item.hasExpiry) answers[item.key].ablauf = "";
    }
  });
  return answers;
}

/* ---------- Quarter helpers ---------- */

function currentQuarter(d){
  const q = Math.floor(d.getMonth()/3) + 1;
  return "Q" + q + " " + d.getFullYear();
}
function parseQuarter(label){
  const m = label.match(/^Q(\d)\s+(\d{4})$/);
  return { q: parseInt(m[1],10), y: parseInt(m[2],10) };
}
function quarterSortKey(label){ const p = parseQuarter(label); return p.y*4 + (p.q-1); }
function quarterByOffset(baseLabel, offset){
  const p = parseQuarter(baseLabel);
  const idx = p.y*4 + (p.q-1) + offset;
  const ny = Math.floor(idx/4);
  const nq = (idx % 4) + 1;
  return "Q" + nq + " " + ny;
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function quarterMidDate(label){
  const p = parseQuarter(label);
  return isoDate(new Date(p.y, (p.q-1)*3 + 1, 15));
}
function fmtDateCH(iso){
  if (!iso) return "–";
  const parts = iso.split("-");
  return parts[2] + "." + parts[1] + "." + parts[0];
}
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

function answerSeverity(item, answer){
  let sev = severity(item, answer.value);
  if (item.hasExpiry && answer.ablauf && answer.ablauf < isoDate(new Date())){
    if (sev !== "bad") sev = "bad";
  }
  return sev;
}

/* ---------- Seed data ---------- */

function buildSeedState(){
  const today = new Date();
  const todayLabel = currentQuarter(today);
  const inspections = {};
  const mangelStatus = {};
  const offsets = [-3,-2,-1,0];

  DEFAULT_VEHICLES.forEach(v => {
    inspections[v.plate] = offsets.map(off => {
      const qLabel = quarterByOffset(todayLabel, off);
      return {
        quarter: qLabel,
        date: off === 0 ? isoDate(today) : quarterMidDate(qLabel),
        inspector: TEAM[Math.abs(off) % TEAM.length],
        answers: defaultAnswers(v.plate),
        createdAt: Date.now() + off,
      };
    });
  });

  function setAnswer(plate, offsetFromNow, key, value, comment){
    const qLabel = quarterByOffset(todayLabel, offsetFromNow);
    const rec = inspections[plate].find(r => r.quarter === qLabel);
    rec.answers[key] = { value, comment, photo:null };
  }

  setAnswer("ZH 407 814", 0, "hochdruckreiniger", "Defekt", "Pumpe verliert Druck, Wasseraustritt am Anschluss.");
  mangelStatus["ZH 407 814__hochdruckreiniger"] = "Offen";

  setAnswer("ZH 257 777", 0, "beleuchtung", "Ungenügend", "Rücklicht rechts ausgefallen.");
  mangelStatus["ZH 257 777__beleuchtung"] = "In Bearbeitung";

  setAnswer("SH 61 779", 0, "innenraum_sauber", "Genügend", "Leichte Verschmutzung auf dem Boden.");
  setAnswer("ZH 618 345", 0, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("SH 46 254", 0, "aussen_sauber", "Genügend", "Fahrzeug sichtbar verschmutzt, Waschtermin nötig.");
  setAnswer("ZH 312 814", 0, "sitze", "Genügend", "Kleiner Fleck auf dem Fahrersitz.");
  setAnswer("ZH 225 209", 0, "logo_lesbar", "Genügend", "Beschriftung an der Heckklappe leicht verblasst.");
  setAnswer("SH 62 757", 0, "bodenbelag", "Genügend", "Teppich abgenutzt, noch kein Loch.");

  setAnswer("SH 45 499", -1, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("ZH 748 799", -2, "erste_hilfe", "Fehlt", "Kein Erste-Hilfe-Set im Fahrzeug vorgefunden.");
  setAnswer("ZH 748 799", -1, "erste_hilfe", "Vorhanden", "Nachgerüstet, neues Set beschafft.");

  ["SH 57 183", "ZH 945 386", "SH 49 742"].forEach(plate => {
    inspections[plate] = inspections[plate].filter(r => r.quarter !== todayLabel);
  });

  [-8, -16].forEach(off => {
    const qLabel = quarterByOffset(todayLabel, off);
    inspections["ZH 112 737"].push({
      quarter: qLabel, date: quarterMidDate(qLabel), inspector: TEAM[Math.abs(off) % TEAM.length],
      answers: defaultAnswers("ZH 112 737"), createdAt: Date.now() + off,
    });
  });

  ["SH 45 499", "SH 52 620"].forEach(plate => {
    const rec = inspections[plate].find(r => r.quarter === todayLabel);
    ["industriestaubsauger","normaler_sauger","wassersauger","blockmaschine","trittteller","buerste",
     "hochdruckreiniger","hd_zubehoer","sicherheitsgurt","hoehensicherung","helm","alu_leiter"].forEach(key => {
      rec.answers[key] = { value: "Nicht benötigt", comment:"", photo:null, ...(rec.answers[key].ablauf !== undefined ? {ablauf:""} : {}) };
    });
  });

  return { vehicles: DEFAULT_VEHICLES.map(v => ({...v})), inspections, mangelStatus };
}

/* ---------- Storage ---------- */

const STORAGE_KEY = "fleet-data-v3";
let STATE = null;

async function loadState(){
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value){
      STATE = JSON.parse(res.value);
      if (!STATE.vehicles) STATE.vehicles = DEFAULT_VEHICLES.map(v => ({...v}));
      return;
    }
  } catch (e) {}
  STATE = buildSeedState();
  await saveState();
}
async function saveState(){
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), true); }
  catch (e){ console.error("Speichern fehlgeschlagen", e); }
}

/* ---------- Derived data ---------- */

function historyList(plate){
  return STATE.inspections[plate].slice().sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter));
}
function latestInspection(plate){ const hist = historyList(plate); return hist[hist.length-1]; }

function severityOfRecord(insp){
  let worst = "ok";
  FIELD_ITEMS.forEach(item => {
    const a = insp.answers[item.key];
    if (!a) return;
    const sev = answerSeverity(item, a);
    if (sev === "bad") worst = "bad";
    else if (sev === "warn" && worst !== "bad") worst = "warn";
  });
  return worst;
}
function vehicleStatus(plate){ return severityOfRecord(latestInspection(plate)); }

function isInspectionDue(plate){
  const latest = latestInspection(plate);
  return quarterSortKey(latest.quarter) < quarterSortKey(currentQuarter(new Date()));
}

function mangelId(plate, key){ return plate + "__" + key; }

function allMangelRows(){
  const rows = [];
  STATE.vehicles.forEach(v => {
    const insp = latestInspection(v.plate);
    FIELD_ITEMS.forEach(item => {
      const a = insp.answers[item.key];
      if (!a) return;
      const sev = answerSeverity(item, a);
      if (sev !== "bad") return;
      const id = mangelId(v.plate, item.key);
      const resp = responsibility(item);
      const status = STATE.mangelStatus[id] || "Offen";
      const fristDate = addDays(insp.date, resp.tage);
      const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date()) && severity(item, a.value) === "ok";
      rows.push({
        id, plate: v.plate, model: v.model, item, value: a.value,
        comment: expired ? "Ablaufdatum überschritten (" + fmtDateCH(a.ablauf) + ")" : a.comment,
        status, zustandig: resp.zustandig, fristLabel: resp.frist, fristDate,
        overdue: status !== "Erledigt" && fristDate < isoDate(new Date()),
        quarter: insp.quarter,
      });
    });
  });
  return rows;
}

function kpiData(){
  let io=0, klein=0, offen=0, faellig=0;
  STATE.vehicles.forEach(v => {
    const s = vehicleStatus(v.plate);
    if (s === "ok") io++; else if (s === "warn") klein++; else offen++;
    if (isInspectionDue(v.plate)) faellig++;
  });
  return { total: STATE.vehicles.length, io, klein, offen, faellig };
}

function addVehicle(plate, art, model){
  const clean = plate.trim().toUpperCase().replace(/\s+/g, " ");
  if (!clean) return "Bitte ein Kontrollschild angeben.";
  if (STATE.vehicles.some(v => v.plate === clean)) return "Dieses Kontrollschild ist bereits erfasst.";
  if (!model.trim()) return "Bitte ein Fahrzeugmodell angeben.";
  const nextNr = Math.max(0, ...STATE.vehicles.map(v => v.nr || 0)) + 1;
  STATE.vehicles.push({ nr: nextNr, plate: clean, art, model: model.trim() });
  STATE.inspections[clean] = [{ quarter: currentQuarter(new Date()), date: isoDate(new Date()), inspector: TEAM[0], answers: defaultAnswers(clean), createdAt: Date.now() }];
  return null;
}
function removeVehicle(plate){
  STATE.vehicles = STATE.vehicles.filter(v => v.plate !== plate);
  delete STATE.inspections[plate];
  Object.keys(STATE.mangelStatus).forEach(id => { if (id.startsWith(plate + "__")) delete STATE.mangelStatus[id]; });
}

function ensureDraft(){

  const q = inspectForm.editingQuarter;
  const key = plate + "__" + q;
  if (inspectForm.draft && inspectForm.draft._key === key) return;
  const existing = STATE.inspections[plate].find(r => r.quarter === q);
  const answers = existing ? JSON.parse(JSON.stringify(existing.answers)) : JSON.parse(JSON.stringify(latestInspection(plate).answers));
  inspectForm.draft = { _key: key, answers, isEdit: !!existing };
  inspectForm.date = existing ? existing.date : isoDate(new Date());
  inspectForm.inspector = existing ? existing.inspector : inspectForm.inspector;
}

function renderFormItem(item){
  if (item.type === "header"){
    return '<div class="form-subheader">' + item.label + '</div>';
  }
  const a = inspectForm.draft.answers[item.key];
  if (item.type === "zahl"){
    return '<div class="form-item"><div class="form-item-label">' + item.label + '</div>' +
      '<input type="number" data-key="' + item.key + '" class="km-input" value="' + a.value + '" style="width:160px"/> km</div>';
  }
  const sev = severity(item, a.value);
  const optionList = OPTIONS[item.type].concat(item.optionalEquipment ? ["Nicht benötigt"] : []);
  const pills = optionList.map(opt => {
    const s = severity(item, opt);
    return '<button type="button" class="zpill z-' + s + (opt===a.value ? " z-active":"") + '" data-key="' + item.key + '" data-value="' + opt + '">' + opt + '</button>';
  }).join("");
  const needsComment = sev === "warn" || sev === "bad";
  const extra = needsComment ? (
    '<div class="form-extra ' + (sev === "bad" ? "form-extra-bad" : "") + '">' +
      '<textarea class="comment-input" data-key="' + item.key + '" placeholder="Bemerkung (Pflicht) …">' + (a.comment||"") + '</textarea>' +
      '<label class="check" style="margin-top:8px">📷 Foto <input type="file" accept="image/*" data-key="' + item.key + '" class="photo-input" style="width:auto"/></label>' +
      (a.photo ? '<span class="hint"> ' + a.photo + ' hinterlegt</span>' : "") +
    '</div>'
  ) : "";
  const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date());
  const ablaufRow = item.hasExpiry && sev !== "na" ? (
    '<div class="ablauf-row' + (expired ? " expired" : "") + '">Ablaufdatum <input type="date" data-key="' + item.key + '" class="ablauf-input" value="' + (a.ablauf||"") + '"/>' +
      (expired ? ' abgelaufen' : "") + '</div>'
  ) : "";
  return '<div class="form-item' + (item.indent ? " form-item-indent":"") + '">' +
    '<div class="form-item-label">' + item.label + '</div>' +
    '<div class="pill-row">' + pills + '</div>' + ablaufRow + extra +
  '</div>';
}

function yearsWithData(plate){
  const years = new Set(historyList(plate).map(r => parseQuarter(r.quarter).y));
  return Array.from(years).sort((a,b) => a-b);
}

  const years = yearsWithData(plate);

/* ---------- PDF export (Clean-Service-Briefkopf) ---------- */

/* Verdana darf lizenzrechtlich nicht eingebettet werden — im PDF steht
   deshalb DejaVu Sans, das der Verdana-Anmutung am nächsten kommt.
   Der Font wird beim ersten PDF einmalig geladen und danach zwischengespeichert. */
const DEJAVU_CDN = "https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/";
let PDF_FONT = null;
let DEJAVU_CACHE = null;

async function ensurePdfFont(doc){
  if (PDF_FONT === "helvetica") return "helvetica";
  try {
    if (!DEJAVU_CACHE){
      const load = async (file) => {
        const res = await fetch(DEJAVU_CDN + file);
        if (!res.ok) throw new Error("HTTP " + res.status + " bei " + file);
        const bytes = new Uint8Array(await res.arrayBuffer());
        let bin = "";
        for (let i=0; i<bytes.length; i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
        return btoa(bin);
      };
      const [normal, bold] = await Promise.all([load("DejaVuSans.ttf"), load("DejaVuSans-Bold.ttf")]);
      DEJAVU_CACHE = { normal, bold };
    }
    doc.addFileToVFS("DejaVuSans.ttf", DEJAVU_CACHE.normal);
    doc.addFont("DejaVuSans.ttf", "DejaVuSans", "normal");
    doc.addFileToVFS("DejaVuSans-Bold.ttf", DEJAVU_CACHE.bold);
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVuSans", "bold");
    PDF_FONT = "DejaVuSans";
  } catch (e){
    console.warn("DejaVu Sans nicht verfügbar — PDF wird in Helvetica erstellt.", e);
    PDF_FONT = "helvetica";
  }
  return PDF_FONT;
}

async function generateInspectionPDF(plate, quarterLabel){
  const v = STATE.vehicles.find(x => x.plate === plate);
  const hist = historyList(plate);
  const insp = hist.find(r => r.quarter === quarterLabel) || hist[hist.length-1];
  const sev = severityOfRecord(insp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const FONT = await ensurePdfFont(doc);
  const pageWidth = doc.internal.pageSize.getWidth();
  const brand = [43, 182, 183];
  const brandDark = [29, 131, 132];
  const inkMuted = [94, 114, 115];

  doc.addImage(LOGO_BASE64, "PNG", 15, 12, 40, 13.5);
  doc.setFont(FONT,"normal"); doc.setFontSize(8.5); doc.setTextColor(...inkMuted);
  doc.text("Clean Service Scaramuzzo AG", pageWidth-15, 14, { align:"right" });
  doc.text("Industriestrasse 5 · 8307 Effretikon", pageWidth-15, 18.5, { align:"right" });
  doc.text("ISO 9001 · ISO 14001 · ISO 45001", pageWidth-15, 23, { align:"right" });
  doc.setDrawColor(...brand); doc.setLineWidth(0.6);
  doc.line(15, 28, pageWidth-15, 28);
  doc.setFontSize(7.5); doc.setTextColor(...inkMuted);
  doc.text("Unterhaltsreinigung · Putzfrauenservice · Spezialreinigung · Hauswartung · Hotelreinigung", 15, 33);

  doc.setFont(FONT,"bold"); doc.setFontSize(16); doc.setTextColor(...brandDark);
  doc.text("Fahrzeug Inspektion – Nr. " + v.nr + " – " + v.plate, 15, 43);

  doc.setFont(FONT,"normal"); doc.setFontSize(10); doc.setTextColor(22,41,42);
  doc.text(v.model + " (" + v.art + ")", 15, 50);
  doc.setFontSize(9.5); doc.setTextColor(...inkMuted);
  doc.text("Quartal: " + insp.quarter + "   ·   Datum: " + fmtDateCH(insp.date) + "   ·   Kontrolliert von: " + insp.inspector + "   ·   Status: " + SEV_LABEL[sev], 15, 56);

  let y = 64;
  SECTIONS.forEach(sec => {
    const body = [];
    sec.items.forEach(item => {
      if (item.type === "header"){
        body.push([{ content:item.label, colSpan:3, styles:{ fontStyle:"bold", fillColor:[234,246,246], textColor:[14,67,68] } }]);
        return;
      }
      const a = insp.answers[item.key];
      if (!a) return;
      if (item.type === "zahl"){ body.push([item.label, a.value + " km", ""]); return; }
      let valueText = a.value;
      if (item.hasExpiry && a.ablauf) valueText += " (Ablauf: " + fmtDateCH(a.ablauf) + ")";
      body.push([item.label.replace(/^– /,""), valueText, a.comment || ""]);
    });
    doc.autoTable({
      startY:y, head:[[sec.title, "Zustand", "Bemerkung"]], body, theme:"grid",
      styles:{ font:FONT, fontSize:8.5, cellPadding:2 },
      headStyles:{ fillColor:brand, textColor:255, fontStyle:"bold" },
      columnStyles:{ 0:{ cellWidth:80 }, 1:{ cellWidth:45 } },
      margin:{ left:15, right:15 },
    });
    y = doc.lastAutoTable.finalY + 8;
  });

  const pageCount = doc.internal.getNumberOfPages();
  for (let i=1; i<=pageCount; i++){
    doc.setPage(i);
    doc.setFont(FONT,"normal"); doc.setFontSize(8); doc.setTextColor(...inkMuted);
    doc.text("Erstellt am " + fmtDateCH(isoDate(new Date())) + " mit dem Clean Service Flottenmanagement-Tool", 15, 287);
    doc.text("Seite " + i + " / " + pageCount, pageWidth-15, 287, { align:"right" });
  }

  const fname = "Fahrzeug-Inspektion_Nr" + v.nr + "_" + v.plate.replace(/\s+/g,"") + "_" + insp.quarter.replace(/\s+/g,"_") + ".pdf";
  doc.setProperties({ title:"Fahrzeug Inspektion – Nr. " + v.nr + " – " + v.plate + " – " + insp.quarter });
  doc.save(fname);
}

    switchView("inspect");
  }));
  document.querySelectorAll('[data-action="open-archive"]').forEach(el => el.addEventListener("click", () => {
    archiveState.plate = el.dataset.plate; archiveState.year = new Date().getFullYear(); switchView("archive");

  const archivePlateSel = document.getElementById("archive-plate");
  if (archivePlateSel) archivePlateSel.addEventListener("change", (e) => { archiveState.plate = e.target.value; render(); });

  if (archivePrev) archivePrev.addEventListener("click", () => { archiveState.year -= 1; render(); });
  const archiveNext = document.querySelector('[data-action="archive-next-year"]');
  if (archiveNext) archiveNext.addEventListener("click", () => { archiveState.year += 1; render(); });
  document.querySelectorAll('[data-action="archive-year"]').forEach(el => el.addEventListener("click", () => { archiveState.year = Number(el.dataset.year); render(); }));

  const addVehicleBtn = document.getElementById("add-vehicle-btn");
  if (addVehicleBtn) addVehicleBtn.addEventListener("click", () => { fleetForm.adding = true; render(); });
  const cancelVehicleBtn = document.getElementById("cancel-vehicle-btn");
  if (cancelVehicleBtn) cancelVehicleBtn.addEventListener("click", () => { fleetForm.adding = false; render(); });
  const saveVehicleBtn = document.getElementById("save-vehicle-btn");
  if (saveVehicleBtn){
    saveVehicleBtn.addEventListener("click", async () => {
      const plate = document.getElementById("add-plate").value;
      const art = document.getElementById("add-art").value;
      const model = document.getElementById("add-model").value;
      const err = addVehicle(plate, art, model);
      const errEl = document.getElementById("add-vehicle-error");
      if (err){ errEl.textContent = err; return; }
      fleetForm.adding = false; await saveState(); render();
    });
  }
  document.querySelectorAll('[data-action="remove-vehicle"]').forEach(el => {
    el.addEventListener("click", async () => {
      const plate = el.dataset.plate;
      if (!confirm("Fahrzeug " + plate + " inkl. seines gesamten Kontrollverlaufs wirklich entfernen?")) return;
      removeVehicle(plate);
      if (inspectForm.plate === plate){ inspectForm.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; inspectForm.formOpen=false; inspectForm.draft=null; }
      if (archiveState.plate === plate){ archiveState.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; }
      await saveState(); render();
    });
  });

  const fleetSearchEl = document.getElementById("fleet-search");
  if (fleetSearchEl){
    fleetSearchEl.addEventListener("input", (e) => {
      fleetSearch = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const again = document.getElementById("fleet-search");
      if (again){ again.focus(); again.setSelectionRange(caret, caret); }
    });
  }

  document.querySelectorAll("[data-mangel-id]").forEach(el => {
    el.addEventListener("change", async (e) => { STATE.mangelStatus[el.dataset.mangelId] = e.target.value; await saveState(); render(); });
  });
  document.querySelectorAll(".tabs [data-filter]").forEach(el => el.addEventListener("click", () => { mangelFilter = el.dataset.filter; render(); }));

  const plateSel = document.getElementById("insp-plate");
  if (plateSel) plateSel.addEventListener("change", (e) => {
    inspectForm.plate = e.target.value; inspectForm.formOpen=false; inspectForm.draft=null; inspectForm.successMsg=null; inspectForm.lastSavedQuarter=null; render();
  });
  const openFormBtn = document.getElementById("open-form-btn");
  if (openFormBtn) openFormBtn.addEventListener("click", () => {
    inspectForm.formOpen = true; inspectForm.editingQuarter = currentQuarter(new Date()); inspectForm.draft=null; inspectForm.successMsg=null; inspectForm.lastSavedQuarter=null; render();
  });
  const cancelBtn = document.getElementById("cancel-inspection");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { inspectForm.formOpen=false; inspectForm.draft=null; render(); });

  const quarterSel = document.getElementById("insp-quarter");
  if (quarterSel) quarterSel.addEventListener("change", (e) => { inspectForm.editingQuarter = e.target.value; inspectForm.draft=null; render(); });
  const dateInput = document.getElementById("insp-date");
  if (dateInput) dateInput.addEventListener("input", (e) => inspectForm.date = e.target.value);
  const inspectorSel = document.getElementById("insp-inspector");
  if (inspectorSel) inspectorSel.addEventListener("change", (e) => inspectForm.inspector = e.target.value);

  document.querySelectorAll(".zpill").forEach(el => el.addEventListener("click", () => {
    inspectForm.draft.answers[el.dataset.key].value = el.dataset.value; render();
  }));
  document.querySelectorAll(".comment-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].comment = e.target.value; }));
  document.querySelectorAll(".photo-input").forEach(el => el.addEventListener("change", (e) => {
    const file = e.target.files[0]; inspectForm.draft.answers[el.dataset.key].photo = file ? file.name : null; render();
  }));
  document.querySelectorAll(".km-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].value = Number(e.target.value); }));
  document.querySelectorAll(".ablauf-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].ablauf = e.target.value; render(); }));

  const submitBtn = document.getElementById("submit-inspection");
  if (submitBtn){
    submitBtn.addEventListener("click", async () => {
      const missing = [];
      FIELD_ITEMS.forEach(item => {
        const a = inspectForm.draft.answers[item.key];
        const sev = item.type === "zahl" ? "info" : severity(item, a.value);
        if (item.type !== "zahl" && (sev==="warn"||sev==="bad") && !a.comment.trim()) missing.push(item.label.replace(/^– /,""));
      });
      const errEl = document.getElementById("inspect-error");
      if (missing.length){ errEl.textContent = "Bitte Bemerkung erfassen für: " + missing.join(", "); return; }
      errEl.textContent = "";

      const plate = inspectForm.plate;
      const quarter = inspectForm.editingQuarter;
      const hist = STATE.inspections[plate];
      const existingIdx = hist.findIndex(r => r.quarter === quarter);
      const record = { quarter, date: inspectForm.date, inspector: inspectForm.inspector, answers: JSON.parse(JSON.stringify(inspectForm.draft.answers)), createdAt: Date.now() };
      if (existingIdx >= 0) hist[existingIdx] = record;
      else { hist.push(record); hist.sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter)); }

      const isNowLatest = quarter === historyList(plate)[historyList(plate).length-1].quarter;
      if (isNowLatest){
        FIELD_ITEMS.forEach(item => {
          const a = record.answers[item.key];
          const id = mangelId(plate, item.key);
          if (answerSeverity(item, a) !== "bad") delete STATE.mangelStatus[id];
          else if (!STATE.mangelStatus[id]) STATE.mangelStatus[id] = "Offen";
        });
      }
      await saveState();
      inspectForm.formOpen=false; inspectForm.draft=null;
      inspectForm.successMsg = "Kontrolle für " + quarter + " gespeichert.";
      inspectForm.lastSavedQuarter = quarter;
      render();
    });
  }
}

/* ---------- Boot ---------- */

async function boot(){
  await loadState();
  inspectForm.plate = STATE.vehicles[0].plate;
  archiveState.plate = STATE.vehicles[0].plate;
  render();
}
boot();

</script>
</body>
</html>
