<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Flottenmanagement"/>
<meta name="theme-color" content="#0E4344"/>
<title>Flottenmanagement | Clean Service Scaramuzzo AG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =====================================================================
   Clean Service Scaramuzzo AG — Layout-Standard
   Übernommen aus ReportingPFS und PFS Trend-Dashboard.
   Türkis 2BB6B7, Verdana, Sidebar in Dunkelpetrol, Karten mit Türkis-Oberkante.
   ===================================================================== */

:root{
  --primary:#2BB6B7;        /* Hauptfarbe CI, RGB 43/182/183 */
  --primary-dark:#1D8384;
  --primary-deep:#0E4344;   /* Sidebar */
  --primary-light:#EAF6F6;
  --ink:#16292A;
  --ink-soft:#5E7273;
  --ink-faint:#8B9C9D;
  --border:#E3ECEC;
  --bg:#FBFCFC;
  --white:#FFFFFF;
  --pos:#2E9E5B;
  --neg:#C1503D;
  --warn:#C98A1B;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Verdana, Geneva, sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,p{ margin:0; }
a{ color:var(--primary-dark); }

/* ============ Sidebar ============ */
.sidebar{
  width:228px;
  background:var(--primary-deep);
  color:#fff;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
}
.sidebar .brand{ padding:22px 22px 18px 22px; display:flex; align-items:center; gap:10px; }
.sidebar .brand img{ width:36px; height:36px; flex-shrink:0; background:#fff; border-radius:8px; padding:4px; object-fit:contain; }
.sidebar .brand-name{ font-size:13.5px; font-weight:bold; line-height:1.3; }
.sidebar .brand small{
  display:block; font-weight:normal;
  color:rgba(255,255,255,.6); font-size:10.5px; margin-top:4px;
}
.sidebar nav{ padding:0 10px; }
.sidebar nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 12px; margin-bottom:2px;
  background:none; border:0; cursor:pointer;
  color:rgba(255,255,255,.75);
  font-family:inherit; font-size:13px;
  border-radius:4px;
}
.sidebar nav button .nav-ic{ font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.sidebar nav button:hover{ background:rgba(255,255,255,.07); color:#fff; }
.sidebar nav button.active{ background:rgba(255,255,255,.1); color:#fff; }

.sidebar-list{
  flex:1; display:flex; flex-direction:column; min-height:0;
  margin-top:6px; padding-top:16px;
  border-top:1px solid rgba(255,255,255,.1);
}
.sidebar-list-head{
  display:flex; justify-content:space-between; align-items:center;
  padding:0 22px 10px 22px;
  font-size:11.5px; color:rgba(255,255,255,.55);
}
.sidebar-item{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding:7px 22px;
  font-size:12.5px; color:rgba(255,255,255,.8);
  cursor:pointer; border-left:2px solid transparent;
}
.sidebar-item:hover{ background:rgba(255,255,255,.06); border-left-color:var(--primary); color:#fff; }
.sidebar-item.active{ background:rgba(255,255,255,.1); border-left-color:var(--primary); color:#fff; }
.sidebar-item .meta{ font-size:11px; color:rgba(255,255,255,.5); white-space:nowrap; }
.sidebar-item .meta.neg{ color:#E8A599; }
.sidebar-empty{ padding:8px 22px; font-size:11.5px; color:rgba(255,255,255,.5); }
.sidebar-footer{
  margin-top:auto; padding:16px 22px;
  font-size:10.5px; color:rgba(255,255,255,.4);
  border-top:1px solid rgba(255,255,255,.1);
}

/* ============ Hauptbereich ============ */
main{ flex:1; padding:36px 40px; max-width:1180px; }

header.page-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  flex-wrap:wrap; gap:16px;
  margin-bottom:28px; padding-bottom:18px;
  border-bottom:1px solid var(--border);
}
header.page-head h1{ font-size:23px; font-weight:bold; letter-spacing:-.01em; margin-bottom:4px; }
header.page-head p{ color:var(--ink-soft); font-size:12.5px; }
.toolbar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.search-input{ width:240px; }

/* ============ Buttons ============ */
.btn{
  background:none; color:var(--ink-soft); border:none;
  padding:8px 12px; border-radius:4px;
  font-family:inherit; font-size:12px; cursor:pointer;
}
.btn:hover{ background:var(--primary-light); color:var(--primary-deep); }
.btn.primary-action{ background:var(--primary); color:#fff; padding:9px 18px; font-weight:bold; }
.btn.primary-action:hover{ background:var(--primary-dark); color:#fff; }
.btn.secondary{ background:var(--white); color:var(--primary-dark); border:1px solid var(--primary); padding:8px 14px; }
.btn.secondary:hover{ background:var(--primary-light); }
.btn.danger{ background:var(--neg); color:#fff; padding:9px 16px; font-weight:bold; }
.btn.danger:hover{ background:#A63F2E; color:#fff; }
.btn.small{ padding:4px 8px; font-size:11px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

/* ============ Kennzahlen ============ */
.kpi-row{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
  gap:14px; margin-bottom:24px;
}
.kpi{
  background:var(--white); border:1px solid var(--border);
  border-top:3px solid var(--primary); border-radius:4px;
  padding:14px 16px;
}
.kpi.due{ border-top-color:var(--ink-soft); }
.kpi.warn{ border-top-color:var(--warn); }
.kpi.neg{ border-top-color:var(--neg); }
.kpi.pos{ border-top-color:var(--pos); }
.kpi .label{ font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
.kpi .value{ font-size:20px; font-weight:bold; }
.kpi .value.pos{ color:var(--pos); }
.kpi .value.neg{ color:var(--neg); }
.kpi .value.warn{ color:var(--warn); }
.kpi .value.due{ color:var(--ink-soft); }
.kpi .value .unit{ font-size:12px; font-weight:normal; color:var(--ink-soft); margin-left:3px; }
.kpi .sub{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }

/* ============ Karten ============ */
.card{
  background:var(--white); border:1px solid var(--border);
  border-radius:6px; padding:20px 22px; margin-bottom:18px;
}
.card h2{ font-size:14.5px; font-weight:bold; margin-bottom:3px; }
.card .desc{ font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; }
.card-head{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap; margin-bottom:14px;
}
.card-head h2{ margin-bottom:0; }
.card.primary{ border-top:3px solid var(--primary-dark); }
.card.flush{ padding:0; }
.card.flush .card-head{ padding:18px 22px 0; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.grid-sidebar{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
.stack > * + *{ margin-top:14px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ============ Tabellen ============ */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:12px; }
th, td{ padding:8px 10px; text-align:right; border-bottom:1px solid var(--border); vertical-align:top; }
th:first-child, td:first-child{ text-align:left; }
th{
  background:var(--primary-light); color:var(--primary-dark);
  font-weight:bold; font-size:11px; white-space:nowrap;
}
tbody tr:hover{ background:#FAFDFD; }
tfoot td{ font-weight:bold; background:#FAFDFD; border-top:1px solid var(--primary); }
td.text, th.text{ text-align:left; }
tr.clickable{ cursor:pointer; }
tr.row-overdue{ background:#F9EBE8; }

/* ============ Marken, Tags, Noten ============ */
.tag{
  display:inline-block; font-size:10px; padding:2px 7px; border-radius:3px;
  background:var(--primary-light); color:var(--primary-dark); white-space:nowrap;
}
.tag.pos{ background:#E6F4EC; color:var(--pos); }
.tag.warn{ background:#FBF2DF; color:var(--warn); }
.tag.neg{ background:#F8E7E3; color:var(--neg); }
.tag.idle{ background:#EFF3F3; color:var(--ink-soft); }

/* ============ Formulare ============ */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; }
.field .hint{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%;
  font-family:inherit; font-size:12.5px; color:var(--ink);
  background:var(--white);
  border:1px solid var(--border); border-radius:4px;
  padding:9px 10px;
}
textarea{ min-height:70px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(43,182,183,.22);
}
.check{
  display:flex; align-items:center; gap:8px;
  font-size:12px; margin-bottom:10px; cursor:pointer;
}
.check input{ width:16px; height:16px; accent-color:var(--primary); }

/* XL-Erfassung für Mitarbeitende vor Ort */
.entry input, .entry select{ font-size:15px; padding:13px 12px; }
.entry label{ font-size:12.5px; }
.entry .btn.primary-action{ padding:14px 22px; font-size:14px; }

/* ============ Hinweise, Leerzustand ============ */
.note{
  border-left:3px solid var(--primary);
  background:var(--primary-light);
  padding:11px 14px; border-radius:0 4px 4px 0;
  font-size:11.5px; line-height:1.55;
}
.note.warn{ border-color:var(--warn); background:#FBF4E4; }
.note.alert{ border-color:var(--neg); background:#F9EBE8; }
.empty{ padding:44px 20px; text-align:center; color:var(--ink-soft); font-size:12px; }
.empty h3{ font-size:14px; color:var(--ink); margin-bottom:6px; }

/* ============ Dialog ============ */
.modal-overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(14,67,68,.45);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  width:min(640px,100%); max-height:88vh; overflow:auto;
  background:var(--white); border-radius:6px;
  box-shadow:0 14px 40px rgba(14,67,68,.28);
  padding:22px 24px; position:relative;
}
.modal h2{ font-size:15px; margin-bottom:16px; }
.modal-close{
  all:unset; cursor:pointer; position:absolute; top:18px; right:20px;
  font-size:15px; color:var(--ink-soft);
}

/* ============ Briefkopf für Druck und PDF ============ */
.letterhead{ display:none; }
.letterhead .lh-top{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:24px; padding-bottom:10px; border-bottom:2px solid var(--primary);
}
.letterhead .lh-logo{ font-size:16px; font-weight:bold; color:var(--primary-dark); }
.letterhead .lh-claim{ font-size:10px; color:var(--ink-soft); margin-top:2px; }
.letterhead .lh-addr{ font-size:10px; text-align:right; line-height:1.5; color:var(--ink-soft); }
.letterhead .lh-div{
  display:flex; gap:12px; flex-wrap:wrap;
  padding-top:6px; font-size:9.5px; color:var(--ink-faint);
}
.letterhead .lh-title{ margin-top:26px; }
.letterhead .lh-title h1{ font-size:18px; }
.letterhead .lh-title p{ font-size:11px; color:var(--ink-soft); margin-top:3px; }

@media print{
  @page{ size:A4 portrait; margin:14mm 14mm 18mm; }
  body{ display:block; background:#fff; font-size:10pt; }
  .sidebar, .toolbar, .no-print, .btn{ display:none !important; }
  main{ padding:0; max-width:none; }
  .letterhead{ display:block; margin-bottom:10mm; }
  .card{ break-inside:avoid; box-shadow:none; }
  .kpi, .card, .tag, th{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}

/* ============ Reiter ============ */
.tabs{ display:flex; gap:20px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto; }
.tabs button{
  background:none; border:0; cursor:pointer;
  font-family:inherit; font-size:12.5px; color:var(--ink-soft);
  padding:10px 0; margin-bottom:-1px;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tabs button.active{ color:var(--primary-dark); font-weight:bold; border-bottom-color:var(--primary); }

/* ============ Mobil / iPhone & iPad ============ */
@media (max-width:900px){
  body{ display:block; }

  /* Bottom tab bar instead of a side sidebar — natural one-handed reach on a phone */
  .sidebar{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:40;
    width:100%; flex-direction:row;
    box-shadow:0 -2px 14px rgba(14,67,68,.22);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sidebar .brand, .sidebar-list, .sidebar-footer{ display:none; }
  .sidebar nav{
    display:flex; width:100%; padding:6px 2px; gap:2px;
  }
  .sidebar nav button{
    flex:1; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; text-align:center; padding:7px 2px 6px; white-space:normal;
    font-size:10px; line-height:1.15; border-radius:8px;
  }
  .sidebar nav button .nav-ic{ font-size:18px; width:auto; }

  main{
    padding:18px 16px calc(78px + env(safe-area-inset-bottom));
    max-width:none;
  }
  .grid-2, .grid-sidebar{ grid-template-columns:1fr; }

  /* iOS Safari zooms in on any input under 16px — keep every field at 16px */
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-size:16px;
  }
  .entry input, .entry select{ font-size:16px; padding:14px 12px; }

  /* Apple HIG minimum 44px tap target */
  .btn{ min-height:40px; padding:10px 14px; font-size:13px; }
  .btn.primary-action{ min-height:48px; font-size:15px; }
  .btn.secondary, .btn.danger{ min-height:44px; }
  .btn.small{ min-height:36px; padding:8px 12px; font-size:12.5px; }
  .zpill{ padding:10px 15px; font-size:13px; }
  .check input{ width:20px; height:20px; }

  header.page-head{ align-items:flex-start; }
  header.page-head h1{ font-size:20px; }
  .toolbar{ width:100%; }
  .search-input{ width:100%; }

  /* Kontrolle-erfassen: keep Speichern reachable without scrolling back up */
  .save-bar{
    position:sticky; bottom:calc(64px + env(safe-area-inset-bottom));
    background:var(--white); margin:16px -22px -20px; padding:14px 22px;
    border-top:1px solid var(--border); box-shadow:0 -4px 12px rgba(14,67,68,.08);
    z-index:10;
  }
  .save-bar .btn.primary-action{ flex:1; }

  /* Wide tables become stacked cards — no sideways scrolling to fill in on a phone */
  table.cards-mobile thead{ display:none; }
  table.cards-mobile, table.cards-mobile tbody, table.cards-mobile tr, table.cards-mobile td{
    display:block; width:100%;
  }
  table.cards-mobile tr{
    margin-bottom:12px; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; background:var(--white);
  }
  table.cards-mobile tr.row-overdue{ background:#FEF4F2; }
  table.cards-mobile td{
    border:none; padding:6px 0; text-align:left !important;
  }
  table.cards-mobile td[data-label]:not([data-label=""])::before{
    content:attr(data-label); display:block; font-size:10px; font-weight:bold;
    text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:3px;
  }
}

/* =====================================================================
   Flottenmanagement — app-eigene Bausteine auf denselben Tokens/Schrift
   ===================================================================== */

/* Swiss-Kontrollschild-Chip (Signatur-Element dieser App) */
.plate{
  display:inline-flex; align-items:stretch; border-radius:4px; overflow:hidden;
  border:1.3px solid var(--ink); font-family:Verdana, Geneva, sans-serif;
  font-weight:bold; font-size:11.5px; background:#fff; color:var(--ink); height:20px;
}
.plate-kt{ background:#0B4EA2; color:#fff; padding:0 5px; display:flex; align-items:center; font-size:9.5px; }
.plate-num{ padding:0 6px; display:flex; align-items:center; letter-spacing:.02em; }

/* Ampel-Übersicht (Fahrzeug-Kachelraster) */
.fleet-chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.fleet-chip{
  all:unset; cursor:pointer; display:flex; flex-direction:column; gap:5px; align-items:flex-start;
  padding:10px 12px; border-radius:4px; border:1px solid var(--border); min-width:150px;
  background:var(--white);
}
.fleet-chip-model{ font-size:10.5px; }
.fleet-chip-ok{ border-left:4px solid var(--pos); background:linear-gradient(135deg, #DCF2E5 0%, var(--white) 65%); }
.fleet-chip-ok .fleet-chip-model{ color:#3E7A5A; }
.fleet-chip-warn{ border-left:4px solid var(--warn); background:linear-gradient(135deg, #FBEBC9 0%, var(--white) 65%); }
.fleet-chip-warn .fleet-chip-model{ color:#8A6413; }
.fleet-chip-bad{ border-left:4px solid var(--neg); background:linear-gradient(135deg, #F7D9D1 0%, var(--white) 65%); }
.fleet-chip-bad .fleet-chip-model{ color:#8E3626; }
.fleet-chip:hover{ filter:brightness(0.97); }
.fleet-chip-due{ outline:1.5px dashed var(--ink-soft); outline-offset:-1px; }

/* Status-Punkt */
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; }
.dot-ok{ background:var(--pos); } .dot-warn{ background:var(--warn); } .dot-bad{ background:var(--neg); }

/* Zustands-Pillen im Kontrollformular */
.pill-row{ display:flex; flex-wrap:wrap; gap:6px; }
.zpill{ all:unset; cursor:pointer; font-size:11.5px; font-weight:bold; padding:6px 12px; border-radius:20px;
  border:1.3px solid var(--border); color:var(--ink-soft); background:#fff; }
.zpill.z-ok.z-active{ background:var(--pos); border-color:var(--pos); color:#fff; }
.zpill.z-warn.z-active{ background:var(--warn); border-color:var(--warn); color:#fff; }
.zpill.z-bad.z-active{ background:var(--neg); border-color:var(--neg); color:#fff; }
.zpill.z-na.z-active{ background:var(--ink-faint); border-color:var(--ink-faint); color:#fff; }
.zpill:not(.z-active):hover{ border-color:var(--ink-soft); color:var(--ink); }

.form-item{ margin-bottom:16px; }
.form-item-label{ font-size:12.5px; font-weight:bold; margin-bottom:7px; }
.form-item-indent{ margin-left:22px; }
.form-subheader{
  font-weight:bold; font-size:13px; color:var(--primary-dark);
  margin:18px 0 4px; padding-top:12px; border-top:1px dashed var(--border);
}
.form-extra{ margin-top:8px; padding:9px 11px; border-radius:0 4px 4px 0; border-left:3px solid var(--warn); background:#FBF4E4; }
.form-extra-bad{ border-left-color:var(--neg); background:#F9EBE8; }
.ablauf-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-soft); font-weight:bold; margin-top:8px; }
.ablauf-row input{ width:auto; }
.ablauf-row.expired{ color:var(--neg); }
.ablauf-row.expired input{ border-color:var(--neg); }

/* Kontroll-Verlauf (Zeitleiste über Quartale) */
.timeline{ display:flex; align-items:flex-start; overflow-x:auto; padding:8px 2px 4px; }
.tl-item{ display:flex; flex-direction:column; align-items:center; min-width:114px; flex-shrink:0; text-align:center; padding:8px; border-radius:4px; }
.tl-item-current{ background:var(--primary-light); }
.tl-quarter{ font-weight:bold; font-size:12px; margin-top:5px; }
.tl-now-badge{ background:var(--primary); color:#fff; font-size:9px; font-weight:bold; padding:1px 6px; border-radius:10px; text-transform:uppercase; margin-top:3px; display:inline-block; }
.tl-meta{ margin:5px 0 6px; line-height:1.4; font-size:10.5px; color:var(--ink-soft); }
.tl-connector{ flex:0 0 26px; height:2px; background:var(--border); margin-top:20px; align-self:flex-start; }

/* Archiv */
.year-nav{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.year-nav-btn{ all:unset; cursor:pointer; font-size:17px; font-weight:bold; color:var(--primary-dark); padding:3px 9px; border-radius:4px; }
.year-nav-btn:hover{ background:var(--primary-light); }
.year-nav-label{ font-size:18px; font-weight:bold; min-width:60px; text-align:center; }
.year-chips{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
.year-chip{ all:unset; cursor:pointer; font-size:11.5px; font-weight:bold; padding:4px 10px; border-radius:20px; background:var(--primary-light); color:var(--ink-soft); }
.year-chip-active{ background:var(--primary-deep); color:#fff; }
.year-summary{ color:var(--ink-soft); font-size:12px; margin-bottom:14px; }
.quarter-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.quarter-card{ border:1px solid var(--border); border-radius:4px; padding:12px; text-align:center; }
.quarter-card-title{ font-weight:bold; font-size:13px; margin-bottom:7px; }
.quarter-card-empty{ color:var(--ink-faint); font-size:11.5px; padding:8px 0; }

.add-vehicle-form{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px; background:var(--primary-light); padding:16px; border-radius:4px; margin-top:14px; }
.add-vehicle-form .field{ margin-bottom:0; }
.due-badge{ font-size:9.5px; font-weight:bold; color:var(--ink-soft); background:#fff; padding:1px 6px; border-radius:10px; border:1px solid var(--ink-soft); }
.nr-badge{ font-size:10px; font-weight:bold; color:var(--primary-dark); background:var(--primary-light); padding:2px 6px; border-radius:3px; white-space:nowrap; }

function seededKm(plate){
  let h = 0;
  for (let i=0;i<plate.length;i++){ h = (h*31 + plate.charCodeAt(i)) >>> 0; }
  return 18000 + (h % 130000);
}

function severity(item, value){
  if (value === "Nicht benötigt") return "na";
  if (item.type === "zahl") return "info";
  if (item.type === "vorhanden_fehlt") return value === "Vorhanden" ? "ok" : "bad";
  if (item.type === "ja_nein") return value === "Nein" ? "ok" : "bad";
  if (value === "Sehr gut" || value === "Gut") return "ok";
  if (value === "Genügend") return "warn";
  return "bad";
}

function responsibility(item){

    return { zustandig:"Administration", frist:"3 Tage", tage:3 };
  }
  return { zustandig:"Fahrer", frist:"1 Woche", tage:7 };
}

function defaultAnswers(plate){

    } else {
      answers[item.key] = { value: GOOD_VALUE[item.type], comment:"", photo:null };
      if (item.hasExpiry) answers[item.key].ablauf = "";
    }
  });
  return answers;
}

/* ---------- Quarter helpers ---------- */

function currentQuarter(d){
  const q = Math.floor(d.getMonth()/3) + 1;
  return "Q" + q + " " + d.getFullYear();
}
function parseQuarter(label){
  const m = label.match(/^Q(\d)\s+(\d{4})$/);
  return { q: parseInt(m[1],10), y: parseInt(m[2],10) };
}
function quarterSortKey(label){ const p = parseQuarter(label); return p.y*4 + (p.q-1); }
function quarterByOffset(baseLabel, offset){
  const p = parseQuarter(baseLabel);
  const idx = p.y*4 + (p.q-1) + offset;
  const ny = Math.floor(idx/4);
  const nq = (idx % 4) + 1;
  return "Q" + nq + " " + ny;
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function quarterMidDate(label){
  const p = parseQuarter(label);
  return isoDate(new Date(p.y, (p.q-1)*3 + 1, 15));
}
function fmtDateCH(iso){
  if (!iso) return "–";
  const parts = iso.split("-");
  return parts[2] + "." + parts[1] + "." + parts[0];
}
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

function answerSeverity(item, answer){
  let sev = severity(item, answer.value);
  if (item.hasExpiry && answer.ablauf && answer.ablauf < isoDate(new Date())){
    if (sev !== "bad") sev = "bad";
  }
  return sev;
}

/* ---------- Seed data ---------- */

function buildSeedState(){
  const today = new Date();
  const todayLabel = currentQuarter(today);
  const inspections = {};
  const mangelStatus = {};
  const offsets = [-3,-2,-1,0];

  DEFAULT_VEHICLES.forEach(v => {
    inspections[v.plate] = offsets.map(off => {
      const qLabel = quarterByOffset(todayLabel, off);
      return {
        quarter: qLabel,
        date: off === 0 ? isoDate(today) : quarterMidDate(qLabel),
        inspector: TEAM[Math.abs(off) % TEAM.length],
        answers: defaultAnswers(v.plate),
        createdAt: Date.now() + off,
      };
    });
  });

  function setAnswer(plate, offsetFromNow, key, value, comment){
    const qLabel = quarterByOffset(todayLabel, offsetFromNow);
    const rec = inspections[plate].find(r => r.quarter === qLabel);
    rec.answers[key] = { value, comment, photo:null };
  }

  setAnswer("ZH 407 814", 0, "hochdruckreiniger", "Defekt", "Pumpe verliert Druck, Wasseraustritt am Anschluss.");
  mangelStatus["ZH 407 814__hochdruckreiniger"] = "Offen";

  setAnswer("ZH 257 777", 0, "beleuchtung", "Ungenügend", "Rücklicht rechts ausgefallen.");
  mangelStatus["ZH 257 777__beleuchtung"] = "In Bearbeitung";

  setAnswer("SH 61 779", 0, "innenraum_sauber", "Genügend", "Leichte Verschmutzung auf dem Boden.");
  setAnswer("ZH 618 345", 0, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("SH 46 254", 0, "aussen_sauber", "Genügend", "Fahrzeug sichtbar verschmutzt, Waschtermin nötig.");
  setAnswer("ZH 312 814", 0, "sitze", "Genügend", "Kleiner Fleck auf dem Fahrersitz.");
  setAnswer("ZH 225 209", 0, "logo_lesbar", "Genügend", "Beschriftung an der Heckklappe leicht verblasst.");
  setAnswer("SH 62 757", 0, "bodenbelag", "Genügend", "Teppich abgenutzt, noch kein Loch.");

  setAnswer("SH 45 499", -1, "reifen", "Genügend", "Profiltiefe im unteren Toleranzbereich, im Auge behalten.");
  setAnswer("ZH 748 799", -2, "erste_hilfe", "Fehlt", "Kein Erste-Hilfe-Set im Fahrzeug vorgefunden.");
  setAnswer("ZH 748 799", -1, "erste_hilfe", "Vorhanden", "Nachgerüstet, neues Set beschafft.");

  ["SH 57 183", "ZH 945 386", "SH 49 742"].forEach(plate => {
    inspections[plate] = inspections[plate].filter(r => r.quarter !== todayLabel);
  });

  [-8, -16].forEach(off => {
    const qLabel = quarterByOffset(todayLabel, off);
    inspections["ZH 112 737"].push({
      quarter: qLabel, date: quarterMidDate(qLabel), inspector: TEAM[Math.abs(off) % TEAM.length],
      answers: defaultAnswers("ZH 112 737"), createdAt: Date.now() + off,
    });
  });

  ["SH 45 499", "SH 52 620"].forEach(plate => {
    const rec = inspections[plate].find(r => r.quarter === todayLabel);
    ["industriestaubsauger","normaler_sauger","wassersauger","blockmaschine","trittteller","buerste",
     "hochdruckreiniger","hd_zubehoer","sicherheitsgurt","hoehensicherung","helm","alu_leiter"].forEach(key => {
      rec.answers[key] = { value: "Nicht benötigt", comment:"", photo:null, ...(rec.answers[key].ablauf !== undefined ? {ablauf:""} : {}) };
    });
  });

  return { vehicles: DEFAULT_VEHICLES.map(v => ({...v})), inspections, mangelStatus };
}

/* ---------- Storage ---------- */

const STORAGE_KEY = "fleet-data-v3";
let STATE = null;

async function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      STATE = JSON.parse(raw);
      if (!STATE.vehicles) STATE.vehicles = DEFAULT_VEHICLES.map(v => ({...v}));
      return;
    }
  } catch (e) {}
  STATE = buildSeedState();
  await saveState();
}
async function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch (e){ console.error("Speichern fehlgeschlagen", e); }
}

/* ---------- Derived data ---------- */

function historyList(plate){
  return STATE.inspections[plate].slice().sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter));
}
function latestInspection(plate){ const hist = historyList(plate); return hist[hist.length-1]; }

function severityOfRecord(insp){
  let worst = "ok";
  FIELD_ITEMS.forEach(item => {
    const a = insp.answers[item.key];
    if (!a) return;
    const sev = answerSeverity(item, a);
    if (sev === "bad") worst = "bad";
    else if (sev === "warn" && worst !== "bad") worst = "warn";
  });
  return worst;
}
function vehicleStatus(plate){ return severityOfRecord(latestInspection(plate)); }

function isInspectionDue(plate){
  const latest = latestInspection(plate);
  return quarterSortKey(latest.quarter) < quarterSortKey(currentQuarter(new Date()));
}

function mangelId(plate, key){ return plate + "__" + key; }

function allMangelRows(){
  const rows = [];
  STATE.vehicles.forEach(v => {
    const insp = latestInspection(v.plate);
    FIELD_ITEMS.forEach(item => {
      const a = insp.answers[item.key];
      if (!a) return;
      const sev = answerSeverity(item, a);
      if (sev !== "bad") return;
      const id = mangelId(v.plate, item.key);
      const resp = responsibility(item);
      const status = STATE.mangelStatus[id] || "Offen";
      const fristDate = addDays(insp.date, resp.tage);
      const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date()) && severity(item, a.value) === "ok";
      rows.push({
        id, plate: v.plate, model: v.model, item, value: a.value,
        comment: expired ? "Ablaufdatum überschritten (" + fmtDateCH(a.ablauf) + ")" : a.comment,
        status, zustandig: resp.zustandig, fristLabel: resp.frist, fristDate,
        overdue: status !== "Erledigt" && fristDate < isoDate(new Date()),
        quarter: insp.quarter,
      });
    });
  });
  return rows;
}

function kpiData(){
  let io=0, klein=0, offen=0, faellig=0;
  STATE.vehicles.forEach(v => {
    const s = vehicleStatus(v.plate);
    if (s === "ok") io++; else if (s === "warn") klein++; else offen++;
    if (isInspectionDue(v.plate)) faellig++;
  });
  return { total: STATE.vehicles.length, io, klein, offen, faellig };
}

/* ---------- Small render helpers ---------- */

const SEV_LABEL = { ok:"Einwandfrei", warn:"Kleiner Mangel", bad:"Offener Mangel", na:"Nicht benötigt" };
const SEV_TAG = { ok:"pos", warn:"warn", bad:"neg", na:"idle" };

function plateChip(plate){
  const parts = plate.split(" ");
  return '<span class="plate"><span class="plate-kt">' + parts[0] + '</span><span class="plate-num">' + parts.slice(1).join(" ") + '</span></span>';
}
function nrBadge(nr){
  return '<span class="nr-badge">Nr. ' + nr + '</span>';
}
function plateWithNr(plate){
  const v = STATE.vehicles.find(x => x.plate === plate);
  return (v ? nrBadge(v.nr) + ' ' : '') + plateChip(plate);
}
function statusDot(sev){
  return '<span class="dot dot-' + (sev === "na" ? "ok" : sev) + '"></span>';
}
function statusTag(sev){
  return '<span class="tag ' + SEV_TAG[sev] + '">' + SEV_LABEL[sev] + '</span>';
}

function addVehicle(plate, art, model){
  const clean = plate.trim().toUpperCase().replace(/\s+/g, " ");
  if (!clean) return "Bitte ein Kontrollschild angeben.";
  if (STATE.vehicles.some(v => v.plate === clean)) return "Dieses Kontrollschild ist bereits erfasst.";
  if (!model.trim()) return "Bitte ein Fahrzeugmodell angeben.";
  const nextNr = Math.max(0, ...STATE.vehicles.map(v => v.nr || 0)) + 1;
  STATE.vehicles.push({ nr: nextNr, plate: clean, art, model: model.trim() });
  STATE.inspections[clean] = [{ quarter: currentQuarter(new Date()), date: isoDate(new Date()), inspector: TEAM[0], answers: defaultAnswers(clean), createdAt: Date.now() }];
  return null;
}
function removeVehicle(plate){
  STATE.vehicles = STATE.vehicles.filter(v => v.plate !== plate);
  delete STATE.inspections[plate];
  Object.keys(STATE.mangelStatus).forEach(id => { if (id.startsWith(plate + "__")) delete STATE.mangelStatus[id]; });
}

/* ---------- Kontrolle durchführen ---------- */

function ensureDraft(){
  const plate = inspectForm.plate;
  const q = inspectForm.editingQuarter;
  const key = plate + "__" + q;
  if (inspectForm.draft && inspectForm.draft._key === key) return;
  const existing = STATE.inspections[plate].find(r => r.quarter === q);
  const answers = existing ? JSON.parse(JSON.stringify(existing.answers)) : JSON.parse(JSON.stringify(latestInspection(plate).answers));
  inspectForm.draft = { _key: key, answers, isEdit: !!existing };
  inspectForm.date = existing ? existing.date : isoDate(new Date());
  inspectForm.inspector = existing ? existing.inspector : inspectForm.inspector;
}

  if (STATE.vehicles.length === 0){
    return '<header class="page-head"><div><h1>Kontrolle durchführen</h1></div></header><div class="card"><div class="empty"><h3>Keine Fahrzeuge erfasst</h3><p>Bitte zuerst in der Fahrzeugliste ein Fahrzeug hinzufügen.</p></div></div>';
  }

    const baseLabel = currentQuarter(new Date());

      '</div>' +

      '</div>' +
    '</div>';
  }

  return '' +
  '<header class="page-head"><div><h1>Kontrolle durchführen</h1><p>Verlauf zuerst — das Formular öffnet sich erst bei Bedarf.</p></div></header>' +
  '<div class="card">' +
    '<div class="field" style="max-width:440px;margin-bottom:0"><label>Fahrzeug</label><select id="insp-plate">' + vehicleOptions + '</select></div>' +
  '</div>' +
  '<div class="card">' +
    '<div class="card-head"><h2>Kontroll-Verlauf — ' + v.plate + ' · ' + v.model + '</h2>' +
    '<button class="btn small secondary" data-action="open-archive" data-plate="' + inspectForm.plate + '">Archiv ansehen</button></div>' +
    (isInspectionDue(inspectForm.plate) ? '<div class="note warn" style="margin-bottom:12px">Kontrolle für ' + currentQuarter(new Date()) + ' steht noch aus — letzte erfasste Kontrolle: ' + latestInspection(inspectForm.plate).quarter + '.</div>' : "") +
    renderHistoryTimeline(inspectForm.plate) +
    (inspectForm.successMsg ? '<div class="note" style="margin-top:12px;border-color:var(--pos);background:#E6F4EC;color:var(--pos)">' + inspectForm.successMsg + '</div>' : "") +
    (inspectForm.lastSavedQuarter ? '<div class="row" style="margin-top:12px"><button class="btn secondary" data-action="download-pdf" data-plate="' + inspectForm.plate + '" data-quarter="' + inspectForm.lastSavedQuarter + '">PDF herunterladen</button></div>' : "") +
    (!inspectForm.formOpen ? '<div class="row" style="margin-top:14px"><button id="open-form-btn" class="btn primary-action">Neue Kontrolle erfassen</button></div>' : "") +
  '</div>' +
  formPanel;
}

function renderFormItem(item){
  if (item.type === "header"){
    return '<div class="form-subheader">' + item.label + '</div>';
  }
  const a = inspectForm.draft.answers[item.key];
  if (item.type === "zahl"){
    return '<div class="form-item"><div class="form-item-label">' + item.label + '</div>' +
      '<input type="number" data-key="' + item.key + '" class="km-input" value="' + a.value + '" style="width:160px"/> km</div>';
  }
  const sev = severity(item, a.value);
  const optionList = OPTIONS[item.type].concat(item.optionalEquipment ? ["Nicht benötigt"] : []);
  const pills = optionList.map(opt => {
    const s = severity(item, opt);
    return '<button type="button" class="zpill z-' + s + (opt===a.value ? " z-active":"") + '" data-key="' + item.key + '" data-value="' + opt + '">' + opt + '</button>';
  }).join("");
  const needsComment = sev === "warn" || sev === "bad";
  const extra = needsComment ? (
    '<div class="form-extra ' + (sev === "bad" ? "form-extra-bad" : "") + '">' +
      '<textarea class="comment-input" data-key="' + item.key + '" placeholder="Bemerkung (Pflicht) …">' + (a.comment||"") + '</textarea>' +
      '<label class="check" style="margin-top:8px">📷 Foto <input type="file" accept="image/*" data-key="' + item.key + '" class="photo-input" style="width:auto"/></label>' +
      (a.photo ? '<span class="hint"> ' + a.photo + ' hinterlegt</span>' : "") +
    '</div>'
  ) : "";
  const expired = item.hasExpiry && a.ablauf && a.ablauf < isoDate(new Date());
  const ablaufRow = item.hasExpiry && sev !== "na" ? (
    '<div class="ablauf-row' + (expired ? " expired" : "") + '">Ablaufdatum <input type="date" data-key="' + item.key + '" class="ablauf-input" value="' + (a.ablauf||"") + '"/>' +
      (expired ? ' abgelaufen' : "") + '</div>'
  ) : "";
  return '<div class="form-item' + (item.indent ? " form-item-indent":"") + '">' +
    '<div class="form-item-label">' + item.label + '</div>' +
    '<div class="pill-row">' + pills + '</div>' + ablaufRow + extra +
  '</div>';
}

/* ---------- Mängel-Liste ---------- */

function renderMangelListe(){
  let rows = allMangelRows();
  if (mangelFilter !== "alle") rows = rows.filter(r => r.status === mangelFilter);
  rows.sort((a,b) => a.fristDate.localeCompare(b.fristDate));
  const filters = ["alle","Offen","In Bearbeitung","Erledigt"].map(f =>
    '<button class="' + (f===mangelFilter ? "active" : "") + '" data-filter="' + f + '">' + (f==="alle"?"Alle":f) + '</button>').join("");
  return '<header class="page-head"><div><h1>Mängel-Liste</h1><p>Alle offenen und erledigten Punkte aus den Kontrollen.</p></div></header>' +
    '<div class="tabs">' + filters + '</div>' +
    '<div class="card flush"><div style="padding:0 22px 20px">' + renderMangelTable(rows, false) + '</div></div>';
}

/* ---------- Archiv ---------- */

function yearsWithData(plate){
  const years = new Set(historyList(plate).map(r => parseQuarter(r.quarter).y));
  return Array.from(years).sort((a,b) => a-b);
}

function renderArchive(){
  if (STATE.vehicles.length === 0){
    return '<header class="page-head"><div><h1>Archiv</h1></div></header><div class="card"><div class="empty"><h3>Keine Fahrzeuge erfasst</h3></div></div>';
  }
  const plate = archiveState.plate;
  const v = STATE.vehicles.find(x => x.plate === plate);
  const vehicleOptions = STATE.vehicles.map(x =>
    '<option value="' + x.plate + '"' + (x.plate===plate ? " selected":"") + '>Nr. ' + x.nr + ' · ' + x.plate + ' — ' + x.model + '</option>').join("");

  const hist = historyList(plate);
  const year = archiveState.year;
  const years = yearsWithData(plate);
  if (!years.includes(new Date().getFullYear())) years.push(new Date().getFullYear());
  years.sort((a,b) => a-b);

  const yearChips = years.map(y =>
    '<button class="year-chip' + (y===year ? " year-chip-active":"") + '" data-action="archive-year" data-year="' + y + '">' + y + '</button>').join("");

  const quarterCards = [1,2,3,4].map(qn => {
    const label = "Q" + qn + " " + year;
    const rec = hist.find(r => r.quarter === label);
    if (!rec) return '<div class="quarter-card"><div class="quarter-card-title">' + label + '</div><div class="quarter-card-empty">keine Kontrolle erfasst</div></div>';
    const sev = severityOfRecord(rec);
    return '<div class="quarter-card"><div class="quarter-card-title">' + label + '</div>' +
      statusDot(sev) + SEV_LABEL[sev] +
      '<div class="hint" style="margin:6px 0">' + fmtDateCH(rec.date) + '<br/>' + rec.inspector + '</div>' +
      '<button class="btn small" data-action="detail-quarter" data-plate="' + plate + '" data-quarter="' + label + '">Ansehen</button></div>';
  }).join("");

  const recorded = [1,2,3,4].filter(qn => hist.some(r => r.quarter === "Q" + qn + " " + year));
  const summary = recorded.length === 0 ? 'Für ' + year + ' liegen noch keine Kontrollen vor.' : recorded.length + ' von 4 Quartalen kontrolliert in ' + year + '.';

  return '' +
  '<header class="page-head"><div><h1>Archiv</h1><p>Vollständiger, jahresweiser Verlauf pro Fahrzeug.</p></div></header>' +
  '<div class="card"><div class="field" style="max-width:440px;margin:0"><label>Fahrzeug</label><select id="archive-plate">' + vehicleOptions + '</select></div></div>' +
  '<div class="card">' +
    '<div class="year-nav"><button class="year-nav-btn" data-action="archive-prev-year">‹</button>' +
    '<div class="year-nav-label">' + year + '</div><button class="year-nav-btn" data-action="archive-next-year">›</button></div>' +
    '<div class="year-chips">' + yearChips + '</div>' +
    '<p class="year-summary">' + summary + '</p>' +
    '<div class="quarter-grid">' + quarterCards + '</div>' +
  '</div>';
}

/* ---------- Vehicle detail modal ---------- */

function openDetail(plate, quarterLabel){
  const v = STATE.vehicles.find(x => x.plate === plate);
  const hist = historyList(plate);
  const insp = quarterLabel ? hist.find(r => r.quarter === quarterLabel) : hist[hist.length-1];
  const sev = severityOfRecord(insp);
  const isLatest = insp.quarter === hist[hist.length-1].quarter;
  const rowsHtml = FIELD_ITEMS.map(item => {
    const a = insp.answers[item.key];
    if (!a) return "";
    const s = severity(item, a.value);
    if (item.type === "zahl") return '<tr><td class="text">' + item.label + '</td><td class="text" colspan="2">' + a.value + ' km</td></tr>';
    const ablaufText = item.hasExpiry && a.ablauf ? ('<div class="hint">Ablauf: ' + fmtDateCH(a.ablauf) + '</div>') : "";
    return '<tr><td class="text">' + item.label.replace(/^– /,"") + '</td>' +
      '<td class="text"><span class="tag ' + SEV_TAG[s] + '">' + a.value + '</span>' + ablaufText + '</td>' +
      '<td class="text hint">' + (a.comment || "–") + '</td></tr>';
  }).join("");

  document.getElementById("modal-root").innerHTML =
    '<div class="modal-overlay" id="modal-backdrop"><div class="modal">' +
      '<button class="modal-close" id="modal-close">✕</button>' +
      '<h2>' + nrBadge(v.nr) + ' ' + plateChip(plate) + ' ' + v.model + ' <span class="hint">(' + v.art + ')</span></h2>' +
      '<div style="margin-bottom:14px">' + statusTag(sev) + '</div>' +
      '<h3 style="font-size:13px;margin-bottom:8px">Kontrolle — ' + insp.quarter + (isLatest ? " (aktuell)" : "") + '</h3>' +
      '<div class="table-wrap"><table><tbody>' + rowsHtml + '</tbody></table></div>' +
      '<h3 style="font-size:13px;margin:18px 0 8px">Verlauf</h3>' +
      renderHistoryTimeline(plate) +
      '<div class="row" style="margin-top:16px">' +
        '<button class="btn secondary" data-action="open-archive" data-plate="' + plate + '">Archiv ansehen</button>' +
        '<button class="btn secondary" data-action="download-pdf" data-plate="' + plate + '" data-quarter="' + insp.quarter + '">PDF herunterladen</button>' +
        '<button class="btn primary-action" id="detail-inspect-btn" data-plate="' + plate + '">Neue Kontrolle für dieses Fahrzeug</button>' +
      '</div>' +
    '</div></div>';

  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop" || e.target.id === "modal-close") closeDetail();
  });
  document.getElementById("detail-inspect-btn").addEventListener("click", () => {
    closeDetail();
    inspectForm.plate = plate; inspectForm.formOpen = true; inspectForm.editingQuarter = currentQuarter(new Date());
    inspectForm.draft = null; inspectForm.successMsg = null;
    switchView("inspect");
  });
  document.querySelectorAll('.modal [data-action="detail-quarter"]').forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.plate, el.dataset.quarter));
  });
  document.querySelectorAll('.modal [data-action="open-archive"]').forEach(el => {
    el.addEventListener("click", () => { closeDetail(); archiveState.plate = el.dataset.plate; archiveState.year = new Date().getFullYear(); switchView("archive"); });
  });
  document.querySelectorAll('.modal [data-action="download-pdf"]').forEach(el => {
    el.addEventListener("click", () => generateInspectionPDF(el.dataset.plate, el.dataset.quarter));
  });
}
function closeDetail(){ document.getElementById("modal-root").innerHTML = ""; }

/* ---------- PDF export (Clean-Service-Briefkopf) ---------- */

function generateInspectionPDF(plate, quarterLabel){
  const v = STATE.vehicles.find(x => x.plate === plate);
  const hist = historyList(plate);
  const insp = hist.find(r => r.quarter === quarterLabel) || hist[hist.length-1];
  const sev = severityOfRecord(insp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const brand = [43, 182, 183];
  const brandDark = [29, 131, 132];
  const inkMuted = [94, 114, 115];

  doc.addImage(LOGO_BASE64, "PNG", 15, 12, 40, 13.5);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...inkMuted);
  doc.text("Clean Service Scaramuzzo AG", pageWidth-15, 14, { align:"right" });
  doc.text("Industriestrasse 5 · 8307 Effretikon", pageWidth-15, 18.5, { align:"right" });
  doc.text("ISO 9001 · ISO 14001 · ISO 45001", pageWidth-15, 23, { align:"right" });
  doc.setDrawColor(...brand); doc.setLineWidth(0.6);
  doc.line(15, 28, pageWidth-15, 28);
  doc.setFontSize(7.5); doc.setTextColor(...inkMuted);
  doc.text("Unterhaltsreinigung · Putzfrauenservice · Spezialreinigung · Hauswartung · Hotelreinigung", 15, 33);

  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...brandDark);
  doc.text("Fahrzeug Inspektion – Nr. " + v.nr + " – " + v.plate, 15, 43);

  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(22,41,42);
  doc.text(v.model + " (" + v.art + ")", 15, 50);
  doc.setFontSize(9.5); doc.setTextColor(...inkMuted);
  doc.text("Quartal: " + insp.quarter + "   ·   Datum: " + fmtDateCH(insp.date) + "   ·   Kontrolliert von: " + insp.inspector + "   ·   Status: " + SEV_LABEL[sev], 15, 56);

  let y = 64;
  SECTIONS.forEach(sec => {
    const body = [];
    sec.items.forEach(item => {
      if (item.type === "header"){
        body.push([{ content:item.label, colSpan:3, styles:{ fontStyle:"bold", fillColor:[234,246,246], textColor:[14,67,68] } }]);
        return;
      }
      const a = insp.answers[item.key];
      if (!a) return;
      if (item.type === "zahl"){ body.push([item.label, a.value + " km", ""]); return; }
      let valueText = a.value;
      if (item.hasExpiry && a.ablauf) valueText += " (Ablauf: " + fmtDateCH(a.ablauf) + ")";
      body.push([item.label.replace(/^– /,""), valueText, a.comment || ""]);
    });
    doc.autoTable({
      startY:y, head:[[sec.title, "Zustand", "Bemerkung"]], body, theme:"grid",
      styles:{ font:"helvetica", fontSize:8.5, cellPadding:2 },
      headStyles:{ fillColor:brand, textColor:255, fontStyle:"bold" },
      columnStyles:{ 0:{ cellWidth:80 }, 1:{ cellWidth:45 } },
      margin:{ left:15, right:15 },
    });
    y = doc.lastAutoTable.finalY + 8;
  });

  const pageCount = doc.internal.getNumberOfPages();
  for (let i=1; i<=pageCount; i++){
    doc.setPage(i);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...inkMuted);
    doc.text("Erstellt am " + fmtDateCH(isoDate(new Date())) + " mit dem Clean Service Flottenmanagement-Tool", 15, 287);
    doc.text("Seite " + i + " / " + pageCount, pageWidth-15, 287, { align:"right" });
  }

  const fname = "Fahrzeug-Inspektion_Nr" + v.nr + "_" + v.plate.replace(/\s+/g,"") + "_" + insp.quarter.replace(/\s+/g,"_") + ".pdf";
  doc.setProperties({ title:"Fahrzeug Inspektion – Nr. " + v.nr + " – " + v.plate + " – " + insp.quarter });
  doc.save(fname);
}

/* ---------- Event wiring ---------- */

function attachViewHandlers(){
  document.querySelectorAll('[data-action="detail"]').forEach(el => el.addEventListener("click", () => openDetail(el.dataset.plate)));
  document.querySelectorAll('[data-action="detail-quarter"]').forEach(el => el.addEventListener("click", () => openDetail(el.dataset.plate, el.dataset.quarter)));
  document.querySelectorAll('[data-action="download-pdf"]').forEach(el => el.addEventListener("click", () => generateInspectionPDF(el.dataset.plate, el.dataset.quarter)));
  document.querySelectorAll('[data-action="inspect-this"]').forEach(el => el.addEventListener("click", () => {
    inspectForm.plate = el.dataset.plate; inspectForm.formOpen = true; inspectForm.editingQuarter = currentQuarter(new Date());
    inspectForm.draft = null; inspectForm.successMsg = null; inspectForm.lastSavedQuarter = null;
    switchView("inspect");
  }));
  document.querySelectorAll('[data-action="open-archive"]').forEach(el => el.addEventListener("click", () => {
    archiveState.plate = el.dataset.plate; archiveState.year = new Date().getFullYear(); switchView("archive");
  }));

  const archivePlateSel = document.getElementById("archive-plate");
  if (archivePlateSel) archivePlateSel.addEventListener("change", (e) => { archiveState.plate = e.target.value; render(); });
  const archivePrev = document.querySelector('[data-action="archive-prev-year"]');
  if (archivePrev) archivePrev.addEventListener("click", () => { archiveState.year -= 1; render(); });
  const archiveNext = document.querySelector('[data-action="archive-next-year"]');
  if (archiveNext) archiveNext.addEventListener("click", () => { archiveState.year += 1; render(); });
  document.querySelectorAll('[data-action="archive-year"]').forEach(el => el.addEventListener("click", () => { archiveState.year = Number(el.dataset.year); render(); }));

  const addVehicleBtn = document.getElementById("add-vehicle-btn");
  if (addVehicleBtn) addVehicleBtn.addEventListener("click", () => { fleetForm.adding = true; render(); });
  const cancelVehicleBtn = document.getElementById("cancel-vehicle-btn");
  if (cancelVehicleBtn) cancelVehicleBtn.addEventListener("click", () => { fleetForm.adding = false; render(); });
  const saveVehicleBtn = document.getElementById("save-vehicle-btn");
  if (saveVehicleBtn){
    saveVehicleBtn.addEventListener("click", async () => {
      const plate = document.getElementById("add-plate").value;
      const art = document.getElementById("add-art").value;
      const model = document.getElementById("add-model").value;
      const err = addVehicle(plate, art, model);
      const errEl = document.getElementById("add-vehicle-error");
      if (err){ errEl.textContent = err; return; }
      fleetForm.adding = false; await saveState(); render();
    });
  }
  document.querySelectorAll('[data-action="remove-vehicle"]').forEach(el => {
    el.addEventListener("click", async () => {
      const plate = el.dataset.plate;
      if (!confirm("Fahrzeug " + plate + " inkl. seines gesamten Kontrollverlaufs wirklich entfernen?")) return;
      removeVehicle(plate);
      if (inspectForm.plate === plate){ inspectForm.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; inspectForm.formOpen=false; inspectForm.draft=null; }
      if (archiveState.plate === plate){ archiveState.plate = STATE.vehicles[0] ? STATE.vehicles[0].plate : null; }
      await saveState(); render();
    });
  });

  const fleetSearchEl = document.getElementById("fleet-search");
  if (fleetSearchEl){
    fleetSearchEl.addEventListener("input", (e) => {
      fleetSearch = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const again = document.getElementById("fleet-search");
      if (again){ again.focus(); again.setSelectionRange(caret, caret); }
    });
  }

  document.querySelectorAll("[data-mangel-id]").forEach(el => {
    el.addEventListener("change", async (e) => { STATE.mangelStatus[el.dataset.mangelId] = e.target.value; await saveState(); render(); });
  });
  document.querySelectorAll(".tabs [data-filter]").forEach(el => el.addEventListener("click", () => { mangelFilter = el.dataset.filter; render(); }));

  const plateSel = document.getElementById("insp-plate");
  if (plateSel) plateSel.addEventListener("change", (e) => {
    inspectForm.plate = e.target.value; inspectForm.formOpen=false; inspectForm.draft=null; inspectForm.successMsg=null; inspectForm.lastSavedQuarter=null; render();
  });
  const openFormBtn = document.getElementById("open-form-btn");
  if (openFormBtn) openFormBtn.addEventListener("click", () => {
    inspectForm.formOpen = true; inspectForm.editingQuarter = currentQuarter(new Date()); inspectForm.draft=null; inspectForm.successMsg=null; inspectForm.lastSavedQuarter=null; render();
  });
  const cancelBtn = document.getElementById("cancel-inspection");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { inspectForm.formOpen=false; inspectForm.draft=null; render(); });

  const quarterSel = document.getElementById("insp-quarter");
  if (quarterSel) quarterSel.addEventListener("change", (e) => { inspectForm.editingQuarter = e.target.value; inspectForm.draft=null; render(); });
  const dateInput = document.getElementById("insp-date");
  if (dateInput) dateInput.addEventListener("input", (e) => inspectForm.date = e.target.value);
  const inspectorSel = document.getElementById("insp-inspector");
  if (inspectorSel) inspectorSel.addEventListener("change", (e) => inspectForm.inspector = e.target.value);

  document.querySelectorAll(".zpill").forEach(el => el.addEventListener("click", () => {
    inspectForm.draft.answers[el.dataset.key].value = el.dataset.value; render();
  }));
  document.querySelectorAll(".comment-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].comment = e.target.value; }));
  document.querySelectorAll(".photo-input").forEach(el => el.addEventListener("change", (e) => {
    const file = e.target.files[0]; inspectForm.draft.answers[el.dataset.key].photo = file ? file.name : null; render();
  }));
  document.querySelectorAll(".km-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].value = Number(e.target.value); }));
  document.querySelectorAll(".ablauf-input").forEach(el => el.addEventListener("input", (e) => { inspectForm.draft.answers[el.dataset.key].ablauf = e.target.value; render(); }));

  const submitBtn = document.getElementById("submit-inspection");
  if (submitBtn){
    submitBtn.addEventListener("click", async () => {
      const missing = [];
      FIELD_ITEMS.forEach(item => {
        const a = inspectForm.draft.answers[item.key];
        const sev = item.type === "zahl" ? "info" : severity(item, a.value);
        if (item.type !== "zahl" && (sev==="warn"||sev==="bad") && !a.comment.trim()) missing.push(item.label.replace(/^– /,""));
      });
      const errEl = document.getElementById("inspect-error");
      if (missing.length){ errEl.textContent = "Bitte Bemerkung erfassen für: " + missing.join(", "); return; }
      errEl.textContent = "";

      const plate = inspectForm.plate;
      const quarter = inspectForm.editingQuarter;
      const hist = STATE.inspections[plate];
      const existingIdx = hist.findIndex(r => r.quarter === quarter);
      const record = { quarter, date: inspectForm.date, inspector: inspectForm.inspector, answers: JSON.parse(JSON.stringify(inspectForm.draft.answers)), createdAt: Date.now() };
      if (existingIdx >= 0) hist[existingIdx] = record;
      else { hist.push(record); hist.sort((a,b) => quarterSortKey(a.quarter) - quarterSortKey(b.quarter)); }

      const isNowLatest = quarter === historyList(plate)[historyList(plate).length-1].quarter;
      if (isNowLatest){
        FIELD_ITEMS.forEach(item => {
          const a = record.answers[item.key];
          const id = mangelId(plate, item.key);
          if (answerSeverity(item, a) !== "bad") delete STATE.mangelStatus[id];
          else if (!STATE.mangelStatus[id]) STATE.mangelStatus[id] = "Offen";
        });
      }
      await saveState();
      inspectForm.formOpen=false; inspectForm.draft=null;
      inspectForm.successMsg = "Kontrolle für " + quarter + " gespeichert.";
      inspectForm.lastSavedQuarter = quarter;
      render();
    });
  }
}

/* ---------- Boot ---------- */

async function boot(){
  await loadState();
  inspectForm.plate = STATE.vehicles[0].plate;
  archiveState.plate = STATE.vehicles[0].plate;
  render();
}
boot();

</script>
